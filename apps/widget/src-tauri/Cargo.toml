[package]
name = "claude-pet-widget"
version = "0.1.1"
edition = "2021"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde_json = "1"

[profile.release]
# A widget that sits on screen all day: small binary, no debug info.
strip = true
lto = true
codegen-units = 1
