[package]
name = "claude-pet-widget"
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/r45635/claude-pet"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
# A widget that sits on screen all day: small binary, no debug info.
strip = true
lto = true
codegen-units = 1
