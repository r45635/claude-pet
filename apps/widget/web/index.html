<!doctype html>
<meta charset="utf-8" />
<title>claude-pet</title>
<!--
  The creature. One page, two hosts:

    - the Tauri widget (apps/widget/src-tauri), which injects window.__CLAUDE_PET__
      = {url, token} read from ~/.claude-pet/endpoint.json, and renders it transparent;
    - any browser, as a Rust-free harness against a running daemon:

        npm run daemon
        open "apps/widget/web/index.html#token=<token printed by the daemon>&debug"
-->
<style>
  :root {
    --bg: #12141a;
    --ink: #14161c;          /* eyes, mouth */
    --skin-base: #8fb8ff;
    --skin-hot: #ff9f68;
    --skin-bad: #ff6b81;
    /* One colour per kind of activity: the antenna bulb, the accessories, the pastilles. */
    --c-sleep: #3a4152;
    --c-think: #c9a2ff;
    --c-read: #7cc4ff;
    --c-act: #5fd4c4;        /* coding, tools */
    --c-wait: #ffd166;
    --c-done: #8bd17c;
    --c-off: #6b7385;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: #c9d1d9;
               font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  body { display: grid; place-items: center; gap: 14px; grid-auto-flow: row; }
  /* Transparent background in the real widget; the dev page paints one so it is visible. */
  #pet { width: 160px; height: 160px; overflow: visible; }
  .critter { --skin: var(--skin-base); --bulb: var(--c-sleep); }
  .skin { fill: var(--skin); transition: fill .8s ease; }
  .skin-line { stroke: var(--skin); transition: stroke .8s ease; }
  .bulb { fill: var(--bulb); transition: fill .4s ease; }
  .ink { fill: var(--ink); }
  .ink-line { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
  .glint { fill: #fff; }
  .cheek { fill: #ff8fa3; opacity: .5; }

  /* Animation intensity is interpolated from load, never switched in steps:
     --dur and --amp are written by JS from the snapshot. */
  .shaker, .body, .eyes, .arm-wait { transform-box: fill-box; }
  .shaker { transform-origin: 50% 100%; }
  .body {
    transform-origin: 50% 70%;
    animation: breathe var(--dur, 3.2s) ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1, 1) translateY(0); }
    50%      { transform: scale(calc(1 + var(--amp, .03)), calc(1 - var(--amp, .03) * .6))
                          translateY(calc(var(--amp, .03) * -40px)); }
  }
  @keyframes shake {
    0%, 100% { transform: translate(0, 0) rotate(0); }
    25%      { transform: translate(-2px, 1px) rotate(-2deg); }
    75%      { transform: translate(2px, -1px) rotate(2deg); }
  }
  @keyframes wave { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(10deg); } }
  @keyframes ring { 0%, 100% { opacity: .15; } 50% { opacity: .7; } }

  /* --- one creature, ten looks ------------------------------------------------------
     Every optional part is `.opt` (hidden) and lists the states that show it as
     `on-<STATE>`. The antenna bulb carries the state's colour; the body only changes
     colour when a human should look: storm (orange) and error (red). */
  .opt { display: none; }
  [data-state="IDLE"] .on-IDLE, [data-state="THINKING"] .on-THINKING,
  [data-state="READING"] .on-READING, [data-state="CODING"] .on-CODING,
  [data-state="TOOL_CALL"] .on-TOOL_CALL, [data-state="HIGH_LOAD"] .on-HIGH_LOAD,
  [data-state="WAITING"] .on-WAITING, [data-state="DONE"] .on-DONE,
  [data-state="ERROR"] .on-ERROR { display: inline; }

  .critter[data-state="THINKING"]  { --bulb: var(--c-think); }
  .critter[data-state="READING"]   { --bulb: var(--c-read); }
  .critter[data-state="CODING"]    { --bulb: var(--c-act); }
  .critter[data-state="TOOL_CALL"] { --bulb: var(--c-act); }
  .critter[data-state="HIGH_LOAD"] { --bulb: var(--c-wait); --skin: var(--skin-hot); }
  .critter[data-state="WAITING"]   { --bulb: var(--c-wait); }
  .critter[data-state="DONE"]      { --bulb: var(--c-done); }
  .critter[data-state="ERROR"]     { --bulb: #ffb3bf; --skin: var(--skin-bad); }

  /* Eyes look where the work is: up and aside while thinking, down at the page while
     reading. A tool running keeps them forward. */
  .eyes { transition: transform .5s ease; }
  [data-state="THINKING"] .eyes { transform: translate(3px, -4px); }
  [data-state="READING"] .eyes  { transform: translate(0, 3px); }
  [data-state="CODING"] .eyes   { transform: translate(0, 2px) scale(1, .75); transform-origin: 50% 50%; }

  .thought circle:nth-child(2) { opacity: .75; }
  .thought circle:nth-child(3) { opacity: .5; }
  [data-state="THINKING"] .thought circle { animation: think 1.2s ease-in-out infinite; }
  [data-state="THINKING"] .thought circle:nth-child(2) { animation-delay: .2s; }
  [data-state="THINKING"] .thought circle:nth-child(3) { animation-delay: .4s; }
  @keyframes think { 0%, 100% { opacity: .25; } 40% { opacity: 1; } }

  .arm-wait { transform-origin: 100% 100%; animation: wave 1.6s ease-in-out infinite; }
  .bulb-ring { animation: ring 1.4s ease-in-out infinite; }

  /* The visual tier (storm, distress) drives the shaking. */
  /* Only the creature shakes: the "why" bubble and the pastilles must stay readable. */
  .critter[data-state="HIGH_LOAD"] .shaker { animation: shake .12s linear infinite; }
  .critter[data-state="ERROR"] .shaker     { animation: shake .4s linear infinite; }

  /* Asleep or disconnected = fully still. An always-visible window that animates while
     nothing happens costs ~8% CPU (measured): macOS recomposites the whole transparent
     window every frame. The idle budget is < 1% — see docs/RISKS.md #6. */
  [data-visual="IDLE"] *, [data-signal="none"] * { animation-play-state: paused !important; }

  /* A disconnected creature must not look like a sleeping one: grey, dashed, unplugged. */
  [data-signal="none"] .critter { --skin: #3a4050; --bulb: transparent; }
  [data-signal="none"] .shaker { animation: none; }
  [data-signal="none"] .opt { display: none !important; }
  [data-signal="none"] .on-NOSIGNAL { display: inline !important; }
  [data-signal="none"] .live-only { display: none; }
  [data-signal="none"] .shell { fill: #262a35; stroke: var(--c-off); stroke-width: 2; stroke-dasharray: 6 5; }
  [data-signal="none"] .antenna { stroke: #4a5163; }
  [data-signal="none"] .bulb { stroke: var(--c-off); stroke-width: 2; }
  [data-signal="none"] .eyes { transform: none; }

  /* The "why" bubble: in a storm or in distress, one short line saying what caused it,
     built from closed values only (snapshot.reason). It sits above the head, in the
     window's margin. */
  #why rect, #why circle { fill: #f4f1ea; }
  #why text { fill: var(--ink); font: 700 11px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  #pet:not([data-why]) #why, #pet[data-why=""] #why { display: none !important; }
  /* A subagent's creature: drawn smaller; its type is in a tooltip. */
  .critter.mini .cheek { display: none; }
  /* Several creatures: the session tray belongs to the single one. */
  #pet[data-multi="true"] #sessions { display: none; }

  /* A family: the parent in the middle, its subagents wandering around it at random
     (JS picks where; the slot's CSS transition walks them there). Walking = quick little
     steps leaning the way they go; stopped = the gesture of what they do. --k is the
     family's tempo (from its session's load). A family where everyone sleeps is fully
     still: no timer, no animation (the idle CPU budget, docs/RISKS.md #6). */
  .kid-slot { transition-property: transform; transition-timing-function: cubic-bezier(.45, 0, .35, 1); }
  .critter.mini { transform-box: fill-box; transform-origin: 50% 100%; }
  /* Same colour as the parent: a dark rim keeps a kid readable when it walks past it. */
  .critter.mini .shell { stroke: rgba(20, 22, 28, .6); stroke-width: 7; paint-order: stroke; }
  .critter.mini.walking.lean-l { animation: step-l calc(.3s * var(--k, 1)) ease-in-out infinite; }
  .critter.mini.walking.lean-r { animation: step-r calc(.3s * var(--k, 1)) ease-in-out infinite; }
  @keyframes step-l { 0%, 100% { transform: rotate(-9deg) translateY(0) scale(1.06, .94); }
                      50% { transform: rotate(-9deg) translateY(-22px) scale(.96, 1.05); } }
  @keyframes step-r { 0%, 100% { transform: rotate(9deg) translateY(0) scale(1.06, .94); }
                      50% { transform: rotate(9deg) translateY(-22px) scale(.96, 1.05); } }
  .critter.mini:not(.walking)[data-state="READING"] { animation: nod calc(2.4s * var(--k, 1)) ease-in-out infinite; }
  .critter.mini:not(.walking)[data-state="CODING"] { animation: tap calc(.36s * var(--k, 1)) cubic-bezier(.3, 0, .3, 1) infinite; }
  .critter.mini:not(.walking)[data-state="TOOL_CALL"] { animation: hammer calc(.8s * var(--k, 1)) cubic-bezier(.6, 0, .2, 1) infinite; }
  .critter.mini:not(.walking)[data-state="THINKING"] { animation: float calc(2.6s * var(--k, 1)) ease-in-out infinite; }
  .critter.mini:not(.walking)[data-state="DONE"] { animation: cheer calc(1.6s * var(--k, 1)) cubic-bezier(.3, 0, .25, 1) infinite; }
  @keyframes nod { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(6deg) translateY(4px); }
                   50% { transform: rotate(-3deg); } 80% { transform: rotate(5deg); } }
  @keyframes tap { 0%, 100% { transform: translateY(0) scale(1.07, .93); } 45% { transform: translateY(-24px) scale(.96, 1.05); } }
  @keyframes hammer { 0%, 100% { transform: rotate(0); } 40% { transform: rotate(-16deg); }
                      55% { transform: rotate(9deg) scale(1.06, .94); } 70% { transform: rotate(0); } }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-30px); } }
  @keyframes cheer { 0%, 100% { transform: translateY(0) scale(1, 1); } 14% { transform: scale(1.18, .82); }
                     40% { transform: translateY(-90px) scale(.9, 1.12); } 58% { transform: translateY(-90px) rotate(360deg); }
                     74% { transform: translateY(0) scale(1.14, .86) rotate(360deg); } 86% { transform: rotate(360deg); } }
  .family[data-still="true"] * { animation-play-state: paused !important; }
  @media (prefers-reduced-motion: reduce) {
    .critter.mini { animation: none !important; }
    .kid-slot { transition-duration: 0s !important; }
  }
  #critters .more { fill: #9aa3b5; font: 700 22px -apple-system, BlinkMacSystemFont, sans-serif; }

  /* In the widget the window itself is the frame: no backdrop, no gap, nothing to scroll. */
  html.widget, html.widget body { background: transparent; overflow: hidden; }
  html.widget #pet { width: var(--pet-size, 150px); height: var(--pet-size, 150px); }
  html.widget body { gap: 0; }

  /* Menu preferences. Paused = asleep on purpose: everything still, no pastilles. */
  [data-show-sessions="false"] #sessions,
  [data-paused="true"] #sessions, [data-paused="true"] .thought { display: none; }
  [data-paused="true"] * { animation-play-state: paused !important; }

  /* Covers the window so the whole creature is a drag handle (Tauri only reads the
     attribute on the element actually clicked, not on its ancestors). */
  #drag { position: fixed; inset: 0; }

  /* One pastille per live Claude Code session on this machine, in a small tray under
     the feet. The creature shows the busiest session; the pastilles say how many there
     are and what each is doing. */
  #tray { fill: rgba(20, 22, 28, .7); }
  #dots circle { transition: fill .6s ease; }
  #dots .thinking { fill: var(--c-think); animation: pulse .8s ease-in-out infinite; }
  #dots .working { fill: var(--c-act); animation: pulse 1.6s ease-in-out infinite; }
  #dots .waiting { fill: var(--c-wait); }
  #dots .done    { fill: var(--c-done); }
  #dots .idle    { fill: #5a6273; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  /* With several sessions, a ring marks the one the creature is showing. */
  #dots .focus { stroke: #eceff4; stroke-width: 1.5; }

  /* ---- chat panel ----------------------------------------------------------------
     Rust's layout_panel grows the window toward the side with room and keeps the
     creature's square fixed on screen; the page then places square and bubble from the
     returned layout (above/below, right/left). */
  html.chat body { display: block; }
  html.chat #pet { position: fixed; }
  html.chat #drag { inset: auto; }
  #chat[hidden] { display: none; }
  #bubble { position: fixed; left: 10px; right: 10px; display: flex; flex-direction: column;
            background: rgba(27, 30, 39, .98); color: #eceff4; border-radius: 22px;
            border: 1px solid #323745;
            box-shadow: 0 18px 40px rgba(0, 0, 0, .4);
            font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  /* The tail: a rotated square on the edge facing the creature, at its centre (--tail-x). */
  #bubble::after { content: ""; position: absolute; left: var(--tail-x, 40px); width: 16px; height: 16px;
                   margin-left: -8px; background: rgb(27, 30, 39); transform: rotate(45deg);
                   border: 1px solid #323745; }
  .above #bubble::after { bottom: -9px; border-top: 0; border-left: 0; }
  .below #bubble::after { top: -9px; border-bottom: 0; border-right: 0; }
  #bubble header { display: flex; align-items: center; gap: 10px; padding: 10px 8px 6px 16px;
                   font-size: 14px; font-weight: 600; }
  /* The dot mirrors the antenna: lavender while its own Claude is answering. */
  #bubble header::before { content: ""; width: 10px; height: 10px; border-radius: 50%;
                           background: #5a6273; transition: background .3s ease; }
  #bubble.busy header::before { background: var(--c-think); }
  #who { flex: 1; }
  #close { width: 32px; height: 32px; border: 0; background: none; color: #9aa3b5; font-size: 18px;
           line-height: 1; cursor: pointer; border-radius: 10px; }
  #close:hover { background: rgba(255, 255, 255, .08); color: #eceff4; }
  #messages { flex: 1; overflow-y: auto; padding: 4px 16px 8px; display: flex;
              flex-direction: column; gap: 10px; }
  #messages:empty::before { content: "Ask me anything — I'm Claude, with my tools."; color: #8b93a7; }
  .you { align-self: flex-end; max-width: 80%; background: var(--skin-base); color: var(--ink);
         padding: 7px 13px; border-radius: 16px 16px 4px 16px; white-space: pre-wrap; }
  .claude { align-self: flex-start; max-width: 100%; overflow-wrap: anywhere; color: #dde2ea; }
  .claude.typing { color: #8b93a7; }
  .claude pre { background: #12141a; padding: 8px 10px; border-radius: 10px; overflow-x: auto;
                font: 12px/1.4 ui-monospace, Menlo, monospace; margin: 4px 0; }
  .claude code { font: 12.5px ui-monospace, Menlo, monospace; background: #2a2f3b;
                 padding: 2px 6px; border-radius: 6px; }
  #status { min-height: 16px; padding: 0 16px; color: #9aa3b5; font-size: 12px; }
  #ask { display: flex; align-items: flex-end; gap: 8px; margin: 6px 10px 10px;
         padding: 4px 4px 4px 14px; border-radius: 18px; background: #232733;
         border: 1px solid #353b4a; }
  #ask:focus-within { border-color: rgba(143, 184, 255, .7); }
  #input { flex: 1; resize: none; border: 0; outline: none; background: none; color: #eceff4;
           font: inherit; padding: 7px 0; max-height: 90px; }
  #send { flex: none; width: 34px; height: 34px; border: 0; border-radius: 12px;
          background: var(--skin-base); color: var(--ink); font-size: 16px; font-weight: 700;
          cursor: pointer; }
  #send.stop { background: var(--skin-bad); font-size: 11px; }

  /* ---- settings, inside the bubble (gear in its header) ------------------------------
     Both values are engine knobs: the page sends a patch through Rust, the daemon
     validates it, writes config.json and the new values come back on the feed. */
  #gear { width: 32px; height: 32px; border: 0; border-radius: 10px; background: none;
          color: #9aa3b5; cursor: pointer; display: grid; place-items: center; }
  #gear:hover, #bubble.settings #gear { background: rgba(255, 255, 255, .08); color: #eceff4; }
  #settings { flex: 1; padding: 6px 16px 14px; display: flex; flex-direction: column; gap: 18px;
              overflow-y: auto; }
  #settings[hidden], #bubble.settings #messages, #bubble.settings #status,
  #bubble.settings #ask { display: none; }
  .setting { display: flex; flex-direction: column; gap: 6px; }
  .setting label { display: flex; justify-content: space-between; align-items: baseline;
                   font-weight: 600; }
  .setting output { font-variant-numeric: tabular-nums; color: var(--skin-base); }
  .setting input[type=range] { width: 100%; accent-color: var(--skin-base); margin: 2px 0; }
  .setting p { margin: 0; font-size: 12px; line-height: 1.4; color: #9aa3b5; }
  .setting .reset { align-self: flex-start; border: 0; background: none; padding: 0;
                    color: #9aa3b5; font: inherit; font-size: 12px; text-decoration: underline;
                    cursor: pointer; }
  .setting .reset:hover { color: #eceff4; }
  #settings-status { min-height: 16px; font-size: 12px; color: #9aa3b5; }

  #hud { font-variant-numeric: tabular-nums; white-space: pre; opacity: .85; }
  #hud[hidden] { display: none; }
</style>

<svg id="pet" viewBox="0 0 160 160" data-visual="IDLE" data-signal="none">
  <defs>
    <!-- One creature. JS clones it per session and per subagent (see renderCritters). -->
    <g id="critter-proto" class="critter" data-state="IDLE">
  <g class="shaker">
  <ellipse cx="80" cy="144" rx="36" ry="5" fill="#000" opacity=".35" />

  <!-- behind the body: arms, storm sparks -->

        fill="none" stroke-width="9" stroke-linecap="round" />
  <path class="opt on-TOOL_CALL skin-line" d="M120 92 Q134 82 132 64"
        fill="none" stroke-width="9" stroke-linecap="round" />
  <g class="opt on-HIGH_LOAD" stroke="var(--c-wait)" stroke-width="3" stroke-linecap="round">
    <path d="M28 48 l-10 -10" /><path d="M24 76 l-13 0" /><path d="M136 76 l13 0" /><path d="M30 112 l-10 6" />
  </g>

  <!-- antenna: the bulb is the state's colour -->
  <line class="antenna skin-line" x1="80" y1="44" x2="80" y2="27" stroke-width="3" stroke-linecap="round" />
  <circle class="bulb-ring opt on-WAITING" cx="80" cy="22" r="11" fill="none" stroke="var(--c-wait)" stroke-width="2" />
  <circle class="bulb" cx="80" cy="22" r="6" />

  <g class="body">
    <ellipse class="skin" cx="62" cy="137" rx="11" ry="6" />
    <ellipse class="skin" cx="98" cy="137" rx="11" ry="6" />
    <path class="shell skin" d="M80 42 C113 42 126 68 126 96 C126 124 107 138 80 138 C53 138 34 124 34 96 C34 68 47 42 80 42 Z" />
    <ellipse class="live-only" cx="80" cy="114" rx="24" ry="15" fill="#fff" opacity=".14" />
    <g class="live-only">
      <ellipse class="cheek" cx="54" cy="100" rx="6" ry="3.5" />
      <ellipse class="cheek" cx="106" cy="100" rx="6" ry="3.5" />
    </g>

    <!-- eyes -->
    <g class="eyes opt on-THINKING on-READING on-CODING on-TOOL_CALL on-WAITING on-ERROR">
      <ellipse class="ink" cx="66" cy="88" rx="5.5" ry="7" />
      <ellipse class="ink" cx="94" cy="88" rx="5.5" ry="7" />

      <ellipse cx="94" cy="87" rx="8" ry="9" fill="#fff" />
      <circle class="ink" cx="66" cy="88" r="3.6" />
      <circle class="ink" cx="94" cy="88" r="3.6" />

    <!-- mouths -->
    <path class="opt on-IDLE ink-line" d="M76 106 Q80 108 84 106" />
    <circle class="opt on-THINKING ink" cx="83" cy="106" r="2.6" />
    <path class="opt on-READING ink-line" d="M77 104 Q80 106 83 104" />

      <path class="ink-line" d="M73 105 Q80 109 87 105" />

    <path class="opt on-HIGH_LOAD ink-line" d="M69 108 q5.5 -5 11 0 q5.5 5 11 0" />
    <ellipse class="opt on-WAITING ink" cx="80" cy="106" rx="3.5" ry="4" />

    <!-- held: the page being read -->

      <path d="M50 112 L80 118 L110 112 L110 132 L80 138 L50 132 Z" fill="#f4f1ea" />
      <line x1="80" y1="118" x2="80" y2="138" stroke="#c9c3b5" stroke-width="1.5" />
      <path d="M57 120 l16 3 M57 126 l16 3 M87 123 l16 -3 M87 129 l16 -3" stroke="#b3ac9c" stroke-width="1.6" stroke-linecap="round" />
    </g>
  </g>

  <!-- floating accessories: what kind of work, at a glance -->
  <g class="opt on-IDLE" fill="var(--c-off)" font-family="ui-monospace, Menlo, monospace" font-weight="700">
    <text x="112" y="50" font-size="15">z</text><text x="124" y="36" font-size="11">z</text>
  </g>
  <g class="thought opt on-THINKING" fill="var(--c-think)">
    <circle cx="116" cy="50" r="3.5" /><circle cx="128" cy="39" r="4.5" /><circle cx="142" cy="26" r="6" />
  </g>
  <text class="opt on-CODING" x="104" y="48" fill="var(--c-act)" font-family="ui-monospace, Menlo, monospace"
        font-size="18" font-weight="700">&lt;/&gt;</text>
  <g class="opt on-TOOL_CALL" fill="none" stroke-linecap="round">
    <g stroke="#d9dee7" stroke-width="5"><path d="M131 60 L142 38" /><path d="M137 30 a7 7 0 1 0 12 4" /></g>
    <path d="M148 52 l6 2 M146 60 l6 4" stroke="var(--c-act)" stroke-width="2.5" />
  </g>
  <path class="opt on-HIGH_LOAD" d="M118 52 q7 10 0 15 q-7 -5 0 -15 Z" fill="#9fd8ff" />
  <g class="opt on-WAITING" fill="var(--c-wait)">

    <rect x="26" y="40" width="6" height="6" rx="1.5" fill="var(--c-wait)" transform="rotate(20 29 43)" />

          font-size="19" font-weight="700">!</text>

  </g>

  </g>
    </g>
  </defs>

  <g id="sessions"><rect id="tray" y="148" height="12" rx="6" /><g id="dots"></g></g>

<div id="hud" hidden></div>
<!-- Over the creature: click = talk, drag = move, right-click = menu. -->
<div id="drag"></div>

<div id="chat" hidden>
  <div id="bubble">
    <header><span id="who">Claude</span>
      <button id="gear" type="button" title="Settings" aria-label="Settings" aria-pressed="false">

             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" />

        <p>Load at which the creature starts to storm. Higher = calmer. It calms down 10 points lower.</p>
        <button class="reset" type="button" data-key="stormThreshold">Back to the temperament's value</button>

        <input id="hold" type="range" min="0" max="10" step="0.5" />
        <p>Each look stays at least this long, so a quick "done" can be seen. Waking up, errors, questions and storms still show at once.</p>

<script type="module">
  const pet = document.getElementById('pet');
  const hud = document.getElementById('hud');
  const dotsLayer = document.getElementById('dots');
  const tray = document.getElementById('tray');
  const SVG_NS = 'http://www.w3.org/2000/svg';

  // Pastilles in a tray under the feet, centred, 12 px apart, in first-seen order so a
  // session keeps its place while others come and go.
  function renderSessions(sessions, focus) {
    const shown = sessions.slice(0, 7);
    while (dotsLayer.childElementCount > shown.length) dotsLayer.lastChild.remove();
    while (dotsLayer.childElementCount < shown.length) {
      const dot = document.createElementNS(SVG_NS, 'circle');
      dot.setAttribute('r', '4');
      dot.setAttribute('cy', '154');
      dotsLayer.appendChild(dot);
    }
    shown.forEach((session, i) => {
      const dot = dotsLayer.children[i];
      dot.setAttribute('cx', (80 + (i - (shown.length - 1) / 2) * 12).toFixed(1));
      const focused = shown.length > 1 && session.id === focus;
      dot.setAttribute('class', focused ? `${session.status} focus` : session.status);
    });
    const w = shown.length ? shown.length * 12 + 4 : 0;
    tray.setAttribute('width', String(w));
    tray.setAttribute('x', String(80 - w / 2));
  }

  // ---- creatures ---------------------------------------------------------------------
  // One creature, as long as there is one session and no subagent: exactly as before.
  // Otherwise one family per session, each in its own square cell: the parent in the
  // middle and its subagents wandering around it at random (see Motion — E · balade).
  // All cells together fit the creature's usual square, never larger.
  const crittersLayer = document.getElementById('critters');
  const proto = document.getElementById('critter-proto');
  const MAX_KIDS = 4;       // beyond, a "+n"
  // A family cell, in the units of the mock-up (a family is wider than tall): parent box
  // and where kids may put their feet. Above parentFeet a kid is behind the parent.
  const CELL = { w: 180, h: 110, parent: { x: 55, y: 6, size: 70 }, kid: 36,
                 area: { x0: 22, x1: 158, y0: 48, y1: 102 }, parentFeet: 72 };
  const WANDERS = new Set(['READING', 'CODING', 'TOOL_CALL', 'THINKING', 'HIGH_LOAD']);
  let crittersKey = '';
  const critterEls = new Map();
  const familyEls = new Map();
  /** Where each family's parent stands, for the why bubble's tail. */
  let familyAnchors = new Map();
  /** Each kid's walk, kept across re-layouts: position in cell units, timer, mode. */
  const walkers = new Map();
  let cells = new Map();     // family id → { x, y, f } (cell origin and scale, viewBox units)

  // Only MAX_KIDS fit: an agent in trouble or waiting on you must never be the one hidden.
  const URGENT = new Set(['ERROR', 'WAITING']);
  const urgentFirst = (agents) => [...agents.filter((a) => URGENT.has(a.state)),
                                   ...agents.filter((a) => !URGENT.has(a.state))];

  function critter(id, mini, title) {
    let el = critterEls.get(id);
    if (!el) {
      el = proto.cloneNode(true);
      el.removeAttribute('id');
      if (mini) {
        el.classList.add('mini');
        const t = document.createElementNS(SVG_NS, 'title');
        t.textContent = title;
        el.prepend(t);
      }
      critterEls.set(id, el);
    }
    return el;
  }
  function slotted(el, cls) {
    const slot = document.createElementNS(SVG_NS, 'g');
    if (cls) slot.setAttribute('class', cls);
    slot.appendChild(el);
    return slot;
  }

  // ---- the walk -------------------------------------------------------------------------
  function kidTransform(cell, w) {
    const t = (w.y - CELL.area.y0) / (CELL.area.y1 - CELL.area.y0);
    const depth = 0.72 + 0.38 * t;               // smaller behind, bigger in front
    const s = cell.f * (CELL.kid / 160) * depth;
    // Scale around the feet: the creature's feet are at (80, 146) in its own drawing.
    return `translate(${(cell.x + w.x * cell.f).toFixed(2)}px, ${(cell.y + w.y * cell.f).toFixed(2)}px) ` +
           `scale(${s.toFixed(4)}) translate(-80px, -146px)`;
  }
  function familyPace(famId) {
    const load = familyLoads.get(famId) ?? 0;
    return 0.6 + load / 100;                      // 0.6 calm … 1.6 storm
  }
  function stopWalker(w) {
    clearTimeout(w.timer);
    w.timer = 0;
  }
  function schedule(key, ms) {
    const w = walkers.get(key);
    if (!w) return;
    clearTimeout(w.timer);
    w.timer = setTimeout(() => walk(key), ms);
  }
  function walk(key) {
    const w = walkers.get(key);
    if (!w || !w.slot || !w.el) return;
    const cell = cells.get(w.family);
    if (!cell || !WANDERS.has(w.el.dataset.state) || !animating()) { w.timer = 0; return; }
    const { x0, x1, y0, y1 } = CELL.area;
    // Somewhere around the parent, but not standing right in front of its belly.
    let nx;
    let ny;
    do {
      nx = x0 + Math.random() * (x1 - x0);
      ny = y0 + Math.random() * (y1 - y0);
    } while (Math.abs(nx - 90) < 34 && ny >= CELL.parentFeet && ny < CELL.parentFeet + 22);
    const pace = familyPace(w.family);
    const dur = Math.max(0.5, Math.hypot(nx - w.x, ny - w.y) / (40 * pace));
    // Behind or in front of the parent is decided at the start, while standing still: a
    // DOM move during a transition would make it jump.
    const front = ny >= CELL.parentFeet;
    const layer = familyEls.get(w.family)?.querySelector(front ? '.front' : '.back');
    if (layer && w.slot.parentNode !== layer) {
      layer.appendChild(w.slot);
      w.slot.getBoundingClientRect(); // settle the old position before the new one
    }
    w.el.classList.add('walking');
    w.el.classList.toggle('lean-l', nx < w.x);
    w.el.classList.toggle('lean-r', nx >= w.x);
    w.x = nx;
    w.y = ny;
    w.slot.style.transitionDuration = `${dur.toFixed(2)}s`;
    w.slot.style.transform = kidTransform(cell, w);
    w.timer = setTimeout(() => {
      w.el.classList.remove('walking');
      schedule(key, (900 + Math.random() * 2400) / pace);
    }, dur * 1000);
  }
  const familyLoads = new Map();
  let animatingNow = false;
  const animating = () => animatingNow;

  // Try every number of columns; keep the one where families come out biggest.
  function layoutCells(n) {
    let best = { f: 0, cols: 1, rows: 1 };
    for (let cols = 1; cols <= n; cols += 1) {
      const rows = Math.ceil(n / cols);
      const f = Math.min(160 / (cols * CELL.w), 160 / (rows * CELL.h));
      if (f > best.f) best = { f, cols, rows };
    }
    return best;
  }

  function renderCritters(s, singleState) {
    const sessions = s.sessions ?? [];
    const multi = sessions.length > 1 || (sessions[0]?.agents ?? []).length > 0;
    pet.dataset.multi = String(multi);
    const asleep = prefs.paused;
    animatingNow = !asleep && (s.sources?.hooks || s.sources?.statusline) && s.visual !== 'IDLE';
    const groups = multi
      ? sessions.map((x) => ({ id: x.id, state: asleep ? 'IDLE' : x.state, load: x.load ?? 0,
                               agents: urgentFirst(x.agents ?? []) }))
      : [{ id: '', state: singleState, load: s.load, agents: [] }];
    for (const g of groups) familyLoads.set(g.id, g.load);

    const key = JSON.stringify([multi, groups.map((g) => [g.id, g.agents.slice(0, MAX_KIDS).map((a) => a.id), g.agents.length > MAX_KIDS])]);
    if (key !== crittersKey) {
      crittersKey = key;
      crittersLayer.replaceChildren();
      familyEls.clear();
      familyAnchors = new Map();
      cells = new Map();
      const keepCritters = new Set();
      const keepWalkers = new Set();
      if (!multi) {
        const family = document.createElementNS(SVG_NS, 'g');
        family.setAttribute('class', 'family');
        familyEls.set('', family);
        family.appendChild(slotted(critter('s:', false)));
        crittersLayer.appendChild(family);
        keepCritters.add('s:');
        familyAnchors.set('', { x: 66, y: 26 });
      } else {
        const { f, cols, rows } = layoutCells(groups.length);
        const x0 = (160 - f * CELL.w * cols) / 2;
        const y0 = (160 - f * CELL.h * rows) / 2;
        groups.forEach((g, i) => {
          const cell = { x: x0 + (i % cols) * CELL.w * f, y: y0 + Math.floor(i / cols) * CELL.h * f, f };
          cells.set(g.id, cell);
          const family = document.createElementNS(SVG_NS, 'g');
          family.setAttribute('class', 'family');
          const back = document.createElementNS(SVG_NS, 'g');
          back.setAttribute('class', 'back');
          const front = document.createElementNS(SVG_NS, 'g');
          front.setAttribute('class', 'front');
          const P = CELL.parent;
          const parent = slotted(critter(`s:${g.id}`, false));
          parent.setAttribute('transform', `translate(${(cell.x + P.x * f).toFixed(2)} ${(cell.y + P.y * f).toFixed(2)}) scale(${(P.size * f / 160).toFixed(4)})`);
          family.append(back, parent, front);
          familyEls.set(g.id, family);
          familyAnchors.set(g.id, { x: cell.x + (P.x + P.size * 0.45) * f, y: cell.y + (P.y + 6) * f });
          crittersLayer.appendChild(family);
          keepCritters.add(`s:${g.id}`);

          g.agents.slice(0, MAX_KIDS).forEach((a, k) => {
            const id = `a:${g.id}:${a.id}`;
            keepCritters.add(id);
            keepWalkers.add(id);
            const el = critter(id, true, `Subagent: ${a.type ?? 'unknown type'}`);
            let w = walkers.get(id);
            if (!w) {
              // A newcomer starts at a random spot around its parent.
              const { x0: ax, x1: bx, y0: ay, y1: by } = CELL.area;
              w = { family: g.id, x: ax + Math.random() * (bx - ax), y: ay + Math.random() * (by - ay), timer: 0 };
              walkers.set(id, w);
            }
            stopWalker(w);
            el.classList.remove('walking');
            w.el = el;
            w.slot = slotted(el, 'kid-slot');
            w.slot.style.transitionDuration = '0s';
            w.slot.style.transform = kidTransform(cell, w);
            (w.y >= CELL.parentFeet ? front : back).appendChild(w.slot);
            schedule(id, 300 + k * 450);
          });
          if (g.agents.length > MAX_KIDS) {
            const more = document.createElementNS(SVG_NS, 'text');
            more.setAttribute('class', 'more');
            more.setAttribute('transform', `translate(${(cell.x + 150 * f).toFixed(1)} ${(cell.y + 30 * f).toFixed(1)}) scale(${(f * 0.8).toFixed(4)})`);
            more.textContent = `+${g.agents.length - MAX_KIDS}`;
            front.appendChild(more);
          }
        });
      }
      for (const id of [...critterEls.keys()]) if (!keepCritters.has(id)) critterEls.delete(id);
      for (const [id, w] of [...walkers]) if (!keepWalkers.has(id)) { stopWalker(w); walkers.delete(id); }
    }

    for (const g of groups) {
      critterEls.get(`s:${g.id}`)?.setAttribute('data-state', g.state);
      const states = [g.state];
      for (const a of g.agents.slice(0, MAX_KIDS)) {
        const state = asleep ? 'IDLE' : a.state;
        states.push(state);
        const id = `a:${g.id}:${a.id}`;
        critterEls.get(id)?.setAttribute('data-state', state);
        // A kid that starts doing something again sets off on its next walk.
        const w = walkers.get(id);
        if (w && !w.timer && WANDERS.has(state) && animatingNow) schedule(id, 400 + Math.random() * 800);
      }
      const family = familyEls.get(g.id);
      if (!family) continue;
      family.dataset.still = String(states.every((st) => st === 'IDLE'));
      if (multi) {
        // Each family at its own session's pace; the single creature keeps #pet's.
        family.style.setProperty('--amp', (0.03 + 0.17 * g.load / 100).toFixed(3));
        family.style.setProperty('--dur', ['3.2s', '1.4s', '0.7s'][familyTier(g.id, g.load)]);
        family.style.setProperty('--k', (1.4 - 0.8 * g.load / 100).toFixed(2)); // calm 1.4 … storm 0.6
      }
    }
  }

  // Speed per family, in the same three tiers as the single creature (changing --dur
  // mid-animation makes it jump, so it only moves between tiers, with hysteresis).
  const familyTiers = new Map();
  function familyTier(id, load) {
    let tier = familyTiers.get(id) ?? 0;
    const up = [0, 35, 70];
    while (tier < 2 && load >= up[tier + 1]) tier += 1;
    while (tier > 0 && load < up[tier] - 8) tier -= 1;
    familyTiers.set(id, tier);
    return tier;
  }

  // What the bubble says. Only closed values reach here (a tool class, an API error enum,
  // a load channel, counts): unknown codes get a generic line, never their raw text.
  const TOOL_NAMES = { bash: 'Bash', read: 'Read', write: 'Write', edit: 'Edit', search: 'Search',
                       fetch: 'Web fetch', task: 'Subagent', todo: 'Todo list', notebook: 'Notebook',
                       mcp: 'An MCP tool' };
  const API_ERRORS = { rate_limit: 'Rate limited', overloaded: 'API overloaded',
                       server_error: 'API server error' };
  // ctx: the counts the storm line can quote for that creature (unknown → generic words).
  function reasonText(r, ctx) {
    if (!r) return '';
    if (r.kind === 'tool_failed') return `${TOOL_NAMES[r.tool] ?? 'A tool'} failed`;
    if (r.kind === 'api_error') return API_ERRORS[r.code] ?? 'API error';
    if (r.kind !== 'storm') return '';
    switch (r.driver) {
      case 'tool': return ctx.toolRate > 0 ? `${ctx.toolRate} tool calls/min` : 'Lots of tool calls';
      case 'agent': return ctx.agents === 1 ? '1 subagent running'
        : ctx.agents > 1 ? `${ctx.agents} subagents running` : 'Lots of subagents';
      case 'file': return 'Lots of files at once';
      case 'generation': return ctx.tokens != null ? `${Math.round(ctx.tokens / 1000)}k tokens/min` : 'Writing a lot';
      default: return '';
    }
  }
  const agentName = (type) => {
    const t = (type ?? 'agent').replace(/[-_]+/g, ' ');
    const short = t.length > 10 ? `${t.slice(0, 9)}…` : t;
    return short.charAt(0).toUpperCase() + short.slice(1);
  };
  // One bubble, always full size: in a crowd, the most urgent message, its tail pointing
  // at the family it is about. Errors (an agent's or a session's) before storms.
  function whyMessage(s) {
    const sessions = s.sessions ?? [];
    const multi = sessions.length > 1 || (sessions[0]?.agents ?? []).length > 0;
    if (!multi) {
      return { text: reasonText(s.reason, { toolRate: s.tool_calls_per_minute, agents: s.active_subagents,
                                            tokens: s.tokens_per_minute }), family: '' };
    }
    for (const x of sessions) {
      const a = (x.agents ?? []).find((ag) => ag.state === 'ERROR' && ag.reason);
      if (a) return { text: `${agentName(a.type)}: ${reasonText(a.reason, {})}`, family: x.id };
    }
    const ctx = (x) => ({ toolRate: x.tool_calls_per_minute, tokens: null,
                          agents: (x.agents ?? []).filter((a) => a.state !== 'DONE').length });
    const bad = sessions.find((x) => x.state === 'ERROR' && x.reason);
    if (bad) return { text: reasonText(bad.reason, ctx(bad)), family: bad.id };
    const storm = sessions.find((x) => x.state === 'HIGH_LOAD' && x.reason);
    if (storm) return { text: reasonText(storm.reason, ctx(storm)), family: storm.id };
    return { text: '', family: '' };
  }
  const whyBubble = document.getElementById('why');
  function renderWhy({ text, family }) {
    pet.dataset.why = text;
    if (!text) return;
    const label = whyBubble.querySelector('text');
    label.textContent = text;
    const natural = Math.round(text.length * 6.6); // display:none can't be measured
    const w = Math.min(156, natural + 22);
    if (natural > w - 22) label.setAttribute('textLength', String(w - 22));
    else label.removeAttribute('textLength');
    const rect = whyBubble.querySelector('rect');
    rect.setAttribute('width', String(w));
    rect.setAttribute('x', String(80 - w / 2));
    // The bubble floats just above the head it is about (a lower row's family gets it over
    // the row above), its tail's two dots leading down to that head.
    const anchor = familyAnchors.get(family) ?? { x: 66, y: 26 };
    const dy = Math.min(Math.max(0, anchor.y - 26), 120);
    whyBubble.setAttribute('transform', `translate(0 ${dy.toFixed(1)})`);
    const [near, far] = whyBubble.querySelectorAll('circle');
    near.setAttribute('cx', String((80 * 0.4 + anchor.x * 0.6).toFixed(1)));
    near.setAttribute('cy', '16');
    far.setAttribute('cx', String(anchor.x.toFixed(1)));
    far.setAttribute('cy', '24');
  }

  // Debug overlay is off by default; `d` toggles it, as does #debug in the URL.
  const params = new URLSearchParams(location.hash.slice(1));
  let debug = params.has('debug');
  const applyDebug = () => { hud.hidden = !debug; };
  applyDebug();
  addEventListener('keydown', (e) => {
    if (e.key === 'd' && e.target === document.body) { debug = !debug; applyDebug(); }
  });

  // The widget host injects the endpoint; the browser harness passes it in the hash.
  const injected = window.__CLAUDE_PET__;
  if (injected !== undefined) document.documentElement.classList.add('widget');
  const token = injected?.token ?? params.get('token') ?? '';
  const base = injected?.url ?? params.get('url') ?? 'http://127.0.0.1:8787';

  // Speed tiers: calm / busy / storm. Enter a tier at its threshold, leave it 8 points lower.
  let currentTier = 0;
  function speedTier(load) {
    const up = [0, 35, 70];
    let tier = currentTier;
    while (tier < 2 && load >= up[tier + 1]) tier += 1;
    while (tier > 0 && load < up[tier] - 8) tier -= 1;
    return tier;
  }

  // ---- host bridge ---------------------------------------------------------------------
  // Everything that writes or acts goes through Rust (Tauri IPC): the menu, preference
  // writes to the daemon, the chat. The page itself only *reads* the daemon's SSE feed.
  const T = window.__TAURI__;
  const invoke = (cmd, args) => (T ? T.core.invoke(cmd, args) : Promise.reject(new Error('no host')));
  let prefs = { temperament: 'normal', chatModel: 'default', size: 'medium', showSessions: true, paused: false };

  // A release webview has no console: report to the daemon log through a GET, the
  // same kind of request as the SSE feed.
  function diag(message) {
    new Image().src = `${base}/log?token=${encodeURIComponent(token)}&m=${encodeURIComponent(message)}`;
  }

  const SIZES = { small: 110, medium: 150, large: 220 };
  let appliedWindow = '';
  function petPx() { return SIZES[prefs.size] ?? SIZES.medium; }
  function fitWindow() {
    if (chatOpen) return; // layout_panel owns the window while the chat is open
    const sq = petPx() + 30;
    if (String(sq) === appliedWindow) return;
    appliedWindow = String(sq);
    invoke('resize', { width: sq, height: sq }).catch((err) => diag(`resize: ${err}`));
  }
  function applyPrefs(p) {
    if (!p) return;
    prefs = p;
    renderSettings(p);
    pet.dataset.showSessions = String(p.showSessions);
    pet.dataset.paused = String(p.paused);
    document.documentElement.style.setProperty('--pet-size', `${petPx()}px`);
    fitWindow();
  }

  addEventListener('contextmenu', (e) => {
    e.preventDefault();
    invoke('show_menu', { prefs }).catch((err) => diag(`menu: ${err}`));
  });

  // ---- click to talk, drag to move ---------------------------------------------------------
  const drag = document.getElementById('drag');
  drag.addEventListener('mousedown', (down) => {
    if (down.button !== 0) return;
    let moved = false;
    const move = (m) => {
      if (Math.hypot(m.screenX - down.screenX, m.screenY - down.screenY) < 4) return;
      moved = true;
      cleanup();
      T?.window.getCurrentWindow().startDragging().catch((err) => diag(`drag: ${err}`));
    };
    const up = () => { cleanup(); if (!moved) toggleChat(); };
    const cleanup = () => { removeEventListener('mousemove', move); removeEventListener('mouseup', up); };
    addEventListener('mousemove', move);
    addEventListener('mouseup', up);
  });

  // ---- chat -----------------------------------------------------------------------------
  const chatEl = document.getElementById('chat');
  const messagesEl = document.getElementById('messages');
  const statusEl = document.getElementById('status');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const PANEL = { w: 340, h: 320 };
  let chatOpen = false;
  let chatBusy = false;
  let current = null; // the .claude element being streamed into

  // Where things go once Rust has laid the window out (see layout_panel in main.rs).
  function place(layout) {
    const sq = petPx() + 30;
    const W = window.innerWidth; // the real window width, whatever Rust settled on
    const root = document.documentElement;
    root.classList.toggle('above', layout.above);
    root.classList.toggle('below', !layout.above);
    const petLeft = layout.right ? 0 : W - sq;
    const petTop = layout.above ? PANEL.h : 0;
    Object.assign(pet.style, { left: `${petLeft + 15}px`, top: `${petTop + 15}px` });
    Object.assign(drag.style, { left: `${petLeft}px`, top: `${petTop}px`, width: `${sq}px`, height: `${sq}px` });
    const bubble = document.getElementById('bubble');
    Object.assign(bubble.style, layout.above
      ? { top: '10px', bottom: `${sq + 4}px` }
      : { top: `${sq + 4}px`, bottom: '10px' });
    bubble.style.setProperty('--tail-x', `${petLeft + sq / 2 - 10}px`);
  }

  async function toggleChat(open = !chatOpen) {
    chatOpen = open;
    if (!open) showSettings(false); // it opens on the conversation next time
    const sq = petPx() + 30;
    let layout = { above: true, right: true };
    if (T) {
      try {
        layout = await invoke('layout_panel', { open, pet: sq, panelW: PANEL.w, panelH: PANEL.h });
      } catch (err) { diag(`layout: ${err}`); }
    }
    document.documentElement.classList.toggle('chat', open);
    chatEl.hidden = !open;
    if (open) {
      place(layout);
      setTimeout(() => input.focus(), 30);
    } else {
      pet.style.left = pet.style.top = '';
      for (const k of ['left', 'top', 'width', 'height']) drag.style[k] = '';
    }
  }

  const escapeHtml = (t) => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // Light markdown, on escaped text only: code blocks, inline code, bold, line breaks.
  function md(text) {
    return escapeHtml(text)
      .split(/```(?:[\w-]*)\n?/)
      .map((part, i) => (i % 2
        ? `<pre>${part.replace(/\n$/, '')}</pre>`
        : part.replace(/`([^`\n]+)`/g, '<code>$1</code>')
              .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
              .replace(/\n/g, '<br>')))
      .join('');
  }
  function addMessage(cls, html) {
    const el = document.createElement('div');
    el.className = cls;
    el.innerHTML = html;
    messagesEl.appendChild(el);
    while (messagesEl.childElementCount > 20) messagesEl.firstChild.remove(); // memory only, bounded
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return el;
  }
  function setBusy(value) {
    chatBusy = value;
    document.getElementById('bubble').classList.toggle('busy', value);
    sendBtn.classList.toggle('stop', value);
    sendBtn.textContent = value ? '■' : '↑';
    sendBtn.title = value ? 'Stop' : 'Send (Enter)';
    last = ''; // re-render the creature now: its own Claude is (not) working
    if (lastFrame) render(lastFrame);
  }

  function onChat(ev) {
    switch (ev.kind) {
      case 'open': toggleChat(true); break;
      case 'reset': messagesEl.replaceChildren(); statusEl.textContent = 'New conversation'; break;
      case 'start':
        current = addMessage('claude typing', '…');
        current.dataset.text = '';
        statusEl.textContent = 'Thinking…';
        setBusy(true);
        break;
      case 'delta':
        if (!current) break;
        current.dataset.text += ev.text;
        current.classList.remove('typing');
        current.innerHTML = md(current.dataset.text);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        statusEl.textContent = 'Writing…';
        break;
      case 'tool': statusEl.textContent = `Using ${ev.name}…`; break;
      case 'done':
        if (current && !current.dataset.text) { current.classList.remove('typing'); current.innerHTML = md(ev.text); }
        statusEl.textContent = [
          ev.isError ? 'Error' : '',
          ev.durationMs != null ? `${(ev.durationMs / 1000).toFixed(1)} s` : '',
          ev.costUsd != null ? `$${ev.costUsd.toFixed(3)}` : '',
        ].filter(Boolean).join(' · ');
        current = null;
        setBusy(false);
        break;
      case 'error':
        if (current && !current.dataset.text) current.remove();
        current = null;
        statusEl.textContent = `⚠ ${ev.message}`;
        setBusy(false);
        break;
    }
  }
  T?.event.listen('chat', (e) => onChat(e.payload));

  function send() {
    if (chatBusy) { invoke('chat_cancel'); return; }
    const text = input.value.trim();
    if (!text) return;
    addMessage('you', escapeHtml(text));
    input.value = '';
    input.style.height = '';
    invoke('chat_ask', { text }).catch((err) => onChat({ kind: 'error', message: String(err) }));
  }
  document.getElementById('ask').addEventListener('submit', (e) => { e.preventDefault(); send(); });
  document.getElementById('close').addEventListener('click', () => toggleChat(false));

  // ---- settings ---------------------------------------------------------------------------
  const bubbleEl = document.getElementById('bubble');
  const gear = document.getElementById('gear');
  const settingsEl = document.getElementById('settings');
  const settingsStatus = document.getElementById('settings-status');
  const SETTINGS = {
    storm: { key: 'stormThreshold', input: document.getElementById('storm'),
             out: document.getElementById('storm-out'), fmt: (v) => `${v}` },
    hold: { key: 'minStateSeconds', input: document.getElementById('hold'),
            out: document.getElementById('hold-out'), fmt: (v) => `${v} s` },
  };
  function showSettings(open) {
    bubbleEl.classList.toggle('settings', open);
    settingsEl.hidden = !open;
    gear.setAttribute('aria-pressed', String(open));
    document.getElementById('who').textContent = open ? 'Settings' : 'Claude';
    settingsStatus.textContent = '';
  }
  gear.addEventListener('click', () => showSettings(!bubbleEl.classList.contains('settings')));
  // Values come from the feed; a slider being dragged is not overwritten under the finger.
  function renderSettings(p) {
    for (const s of Object.values(SETTINGS)) {
      const value = p[s.key];
      if (typeof value !== 'number') continue;
      if (document.activeElement !== s.input) s.input.value = String(value);
      s.out.textContent = s.fmt(Number(s.input.value));
    }
  }
  async function savePref(key, value) {
    settingsStatus.textContent = 'Saving…';
    try {
      applyPrefs(await invoke('update_prefs', { patch: { [key]: value } }));
      settingsStatus.textContent = 'Saved';
    } catch (err) {
      settingsStatus.textContent = `Not saved: ${err}`;
    }
  }
  for (const s of Object.values(SETTINGS)) {
    s.input.addEventListener('input', () => { s.out.textContent = s.fmt(Number(s.input.value)); });
    s.input.addEventListener('change', () => { savePref(s.key, Number(s.input.value)); s.input.blur(); });
  }
  for (const button of settingsEl.querySelectorAll('.reset')) {
    button.addEventListener('click', () => savePref(button.dataset.key, null));
  }
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = `${Math.min(input.scrollHeight, 90)}px`;
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && chatOpen) toggleChat(false); });

  // Browser-harness demo, to review the design without a Tauri host:
  //   index.html#demo=chat&layout=above-right  (or below-left, …)
  if (params.get('demo') === 'chat') {
    const [v, h] = (params.get('layout') ?? 'above-right').split('-');
    chatOpen = true;
    document.documentElement.classList.add('chat', 'widget');
    document.body.style.background = '#3b4252';
    chatEl.hidden = false;
    place({ above: v === 'above', right: h === 'right' });
    addMessage('you', 'tu peux me résumer le README du projet ?');
    addMessage('claude', md("Bien sûr ! **claude-pet** est une créature de bureau qui visualise l'activité observable de Claude Code.\n\nPour lancer le daemon : `npm run daemon`"));
    addMessage('you', 'et la commande pour les tests ?');
    addMessage('claude typing', '…');
    statusEl.textContent = 'Using Bash…';
    chatBusy = true;
    sendBtn.classList.add('stop');
    sendBtn.textContent = '■';
  }

  // Frames arrive every 100 ms–1 s; touching the DOM only on change keeps an idle page idle.
  let last = '';
  let lastFrame = null;
  function render(s) {
    lastFrame = s;
    applyPrefs(s.prefs);
    const key = JSON.stringify([chatBusy, s.visual, s.load, s.state, s.reason, s.tool_calls_per_minute, s.tokens_per_minute, s.context_load, s.sources, s.prefs,
                                (s.sessions ?? []).map((x) => [x.id, x.status, x.state, x.load, x.reason, x.tool_calls_per_minute,
                                                             (x.agents ?? []).map((a) => [a.id, a.state, a.reason])]), s.focus,
                                s.active_subagents, debug && s.estimated_activity_rate]);
    if (key === last) return;
    last = key;
    // Paused: render as asleep whatever the engine says (it keeps running underneath, so
    // resuming is accurate at once).
    // Its own Claude answering is observable from right here (the run is ours), so it
    // shows as thinking even though that session bypasses the hooks.
    pet.dataset.visual = prefs.paused ? 'IDLE' : chatBusy && s.visual === 'IDLE' ? 'ACTIVE' : s.visual;
    renderCritters(s, prefs.paused ? 'IDLE' : chatBusy && s.visual !== 'HIGH_LOAD' ? 'THINKING' : s.state);
    renderSessions(s.sessions ?? [], s.focus);
    renderWhy(prefs.paused ? { text: '', family: '' } : whyMessage(s));
    // "no signal" is a distinct look from "idle": see docs/RISKS.md #5.
    pet.dataset.signal = s.sources.hooks || s.sources.statusline ? 'live' : 'none';

    // Amplitude follows load continuously: changing a custom property inside running
    // keyframes is seamless. Speed does NOT: every change of animation-duration re-maps
    // the current phase and the creature visibly jumps — at one change per 100 ms tick
    // that read as "choppy". So speed moves through three tiers, with hysteresis.
    const t = s.load / 100;
    pet.style.setProperty('--amp', (0.03 + 0.17 * t).toFixed(3));
    const tier = speedTier(s.load);
    if (tier !== currentTier) {
      currentTier = tier;
      pet.style.setProperty('--dur', ['3.2s', '1.4s', '0.7s'][tier]);
    }

    const ctx = s.context_load === null ? '  —' : `${String(s.context_load).padStart(2)}%`;
    hud.textContent =
      `STATE: ${s.state.padEnd(10)} LOAD: ${String(s.load).padStart(3)}\n` +
      `EVENTS/MIN: ${String(s.estimated_activity_rate).padStart(4)}  CTX: ${ctx}\n` +
      `agents ${s.active_subagents}  conf ${s.load_confidence.toFixed(2)}  ` +
      `hooks:${s.sources.hooks ? 'y' : 'n'} net:${s.sources.net ? 'y' : 'n'} sl:${s.sources.statusline ? 'y' : 'n'}\n` +
      (s.sessions ?? []).map((x) => `${x.id} ${x.status}`).join('  ');
  }

  function connect() {
    const es = new EventSource(`${base}/events?token=${encodeURIComponent(token)}`);
    es.onmessage = (e) => { try { render(JSON.parse(e.data)); } catch { /* keep last frame */ } };
    // EventSource reconnects on its own; this only surfaces the gap to the viewer.
    es.onerror = () => { pet.dataset.signal = 'none'; };
  }
  connect();
</script>
