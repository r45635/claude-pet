<!doctype html>
<meta charset="utf-8" />
<title>claude-pet</title>
<!--
  The creature. One page, two hosts:

    - the Tauri widget (apps/widget/src-tauri), which injects window.__CLAUDE_PET__
      = {url, token} read from ~/.claude-pet/endpoint.json, and renders it transparent;
    - any browser, as a Rust-free harness against a running daemon:

        npm run daemon
        open "apps/widget/web/index.html#token=<token printed by the daemon>&debug"
-->
<style>
  :root {
    --bg: #11131a;
    --skin: #7cc4ff;
    --skin-hot: #ff9f68;
    --skin-bad: #ff6b81;
    --eye: #11131a;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: #c9d1d9;
               font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  body { display: grid; place-items: center; gap: 14px; grid-auto-flow: row; }
  /* Transparent background in the real widget; the dev page paints one so it is visible. */
  #pet { width: 160px; height: 160px; overflow: visible; }

  /* Animation intensity is interpolated from load, never switched in steps:
     --dur and --amp are written by JS from the snapshot. */
  #body {
    transform-origin: 50% 70%;
    animation: breathe var(--dur, 3.2s) ease-in-out infinite;
  }
  #arms { animation: flail var(--dur, 3.2s) ease-in-out infinite; transform-origin: 50% 55%; }
  #sparks { opacity: 0; transition: opacity .6s ease; }
  #body { transition: fill .8s ease; }

  @keyframes breathe {
    0%, 100% { transform: scale(1, 1) translateY(0); }
    50%      { transform: scale(calc(1 + var(--amp, .03)), calc(1 - var(--amp, .03) * .6))
                          translateY(calc(var(--amp, .03) * -40px)); }
  }
  @keyframes flail {
    0%, 100% { transform: rotate(calc(var(--amp, .03) * -60deg)); }
    50%      { transform: rotate(calc(var(--amp, .03) * 60deg)); }
  }
  @keyframes shake {
    0%, 100% { transform: translate(0, 0) rotate(0); }
    25%      { transform: translate(-2px, 1px) rotate(-2deg); }
    75%      { transform: translate(2px, -1px) rotate(2deg); }
  }

  /* --- the four MVP visual states ----------------------------------------------- */
  [data-visual="IDLE"] #body  { fill: var(--skin); }
  [data-visual="IDLE"] .lid   { opacity: 1; }          /* eyes closed: sleeping */
  /* Asleep or disconnected = fully still. An always-visible window that animates while
     nothing happens costs ~8% CPU (measured): macOS recomposites the whole transparent
     window every frame. The idle budget is < 1% — see docs/RISKS.md #6. */
  [data-visual="IDLE"] *, [data-signal="none"] * { animation-play-state: paused !important; }

  [data-visual="ACTIVE"] #body { fill: var(--skin); }
  [data-visual="ACTIVE"] .lid  { opacity: 0; }         /* eyes open */

  [data-visual="HIGH_LOAD"] #body   { fill: var(--skin-hot); }
  [data-visual="HIGH_LOAD"] .lid    { opacity: 0; }
  [data-visual="HIGH_LOAD"] #pet    { animation: shake .12s linear infinite; }
  [data-visual="HIGH_LOAD"] #sparks { opacity: 1; }

  [data-visual="ERROR"] #body { fill: var(--skin-bad); }
  [data-visual="ERROR"] .lid  { opacity: 0; }
  [data-visual="ERROR"] #pet  { animation: shake .4s linear infinite; }
  [data-visual="ERROR"] #mouth { d: path("M 62 108 Q 80 94 98 108"); }  /* frown */

  /* A disconnected creature must not look like a sleeping one. */
  [data-signal="none"] #body { fill: #3a4050; }
  [data-signal="none"] #pet  { opacity: .45; }

  /* In the widget the window itself is the frame: no backdrop, no gap, nothing to scroll. */
  html.widget, html.widget body { background: transparent; overflow: hidden; }
  html.widget #pet { width: var(--pet-size, 150px); height: var(--pet-size, 150px); }
  html.widget body { gap: 0; }

  /* Menu preferences. Paused = asleep on purpose: everything still, no pastilles. */
  [data-show-sessions="false"] #sessions,
  [data-paused="true"] #sessions, [data-paused="true"] #thought { display: none; }
  [data-paused="true"] * { animation-play-state: paused !important; }

  /* Covers the window so the whole creature is a drag handle (Tauri only reads the
     attribute on the element actually clicked, not on its ancestors). */
  #drag { position: fixed; inset: 0; }

  /* THINKING — measured: bytes are streaming into a `claude` process. Eyes up and to
     the side, and a thought bubble whose dots light in turn. Distinct from a tool
     running, which keeps the eyes forward. */
  .eye { transition: transform .5s ease; }
  #thought { opacity: 0; transition: opacity .4s ease; }
  #thought circle { opacity: .25; }
  [data-state="THINKING"] .eye { transform: translate(3px, -4px); }
  [data-state="THINKING"] #thought { opacity: 1; }
  [data-state="THINKING"] #thought circle { animation: think 1.2s ease-in-out infinite; }
  [data-state="THINKING"] #thought circle:nth-child(2) { animation-delay: .2s; }
  [data-state="THINKING"] #thought circle:nth-child(3) { animation-delay: .4s; }
  @keyframes think { 0%, 100% { opacity: .25; } 40% { opacity: 1; } }

  /* One pastille per live Claude Code session on this machine. The creature shows the
     busiest session; the pastilles say how many there are and what each is doing. */
  #sessions circle { stroke: var(--bg-ring, #11131a); stroke-width: 1.5;
                     transition: fill .6s ease; }
  #sessions .thinking { fill: #c9a2ff; animation: pulse .8s ease-in-out infinite; }
  #sessions .working { fill: #7cc4ff; animation: pulse 1.6s ease-in-out infinite; }
  #sessions .waiting { fill: #ffd166; }
  #sessions .done    { fill: #8bd17c; }
  #sessions .idle    { fill: #5a6273; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

  /* ---- chat panel ----------------------------------------------------------------
     Rust's layout_panel grows the window toward the side with room and keeps the
     creature's square fixed on screen; the page then places square and bubble from the
     returned layout (above/below, right/left). */
  html.chat body { display: block; }
  html.chat #pet { position: fixed; }
  html.chat #drag { inset: auto; }
  #chat[hidden] { display: none; }
  #bubble { position: fixed; left: 10px; right: 10px; display: flex; flex-direction: column;
            background: rgba(24, 27, 36, .97); color: #e6edf3; border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, .09);
            box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
            font: 13.5px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  /* The tail: a rotated square on the edge facing the creature, at its centre (--tail-x). */
  #bubble::after { content: ""; position: absolute; left: var(--tail-x, 40px); width: 14px; height: 14px;
                   margin-left: -7px; background: rgb(24, 27, 36); transform: rotate(45deg);
                   border: 1px solid rgba(255, 255, 255, .09); }
  .above #bubble::after { bottom: -8px; border-top: 0; border-left: 0; }
  .below #bubble::after { top: -8px; border-bottom: 0; border-right: 0; }
  #bubble header { display: flex; align-items: center; padding: 8px 10px 2px 14px;
                   font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: #8b949e; }
  #who { flex: 1; }
  #close { border: 0; background: none; color: #8b949e; font-size: 18px; line-height: 1;
           cursor: pointer; padding: 2px 6px; border-radius: 6px; }
  #close:hover { background: rgba(255, 255, 255, .08); color: #e6edf3; }
  #messages { flex: 1; overflow-y: auto; padding: 4px 14px 6px; display: flex;
              flex-direction: column; gap: 8px; }
  #messages:empty::before { content: "Ask me anything — I'm Claude, with my tools."; color: #6e7681; }
  .you { align-self: flex-end; max-width: 85%; background: #2f81f7; color: #fff;
         padding: 6px 11px; border-radius: 14px 14px 4px 14px; white-space: pre-wrap; }
  .claude { align-self: flex-start; max-width: 100%; overflow-wrap: anywhere; }
  .claude.typing { color: #8b949e; }
  .claude pre { background: #0d1117; padding: 7px 9px; border-radius: 8px; overflow-x: auto;
                font: 12px/1.4 ui-monospace, Menlo, monospace; margin: 4px 0; }
  .claude code { font: 12px ui-monospace, Menlo, monospace; background: rgba(110, 118, 129, .25);
                 padding: 1px 4px; border-radius: 4px; }
  #status { min-height: 15px; padding: 0 14px; color: #8b949e; font-size: 11px; }
  #ask { display: flex; align-items: flex-end; gap: 6px; margin: 6px 10px 10px;
         padding: 4px 4px 4px 12px; border-radius: 20px; background: rgba(255, 255, 255, .06);
         border: 1px solid rgba(255, 255, 255, .1); }
  #ask:focus-within { border-color: rgba(124, 196, 255, .6); }
  #input { flex: 1; resize: none; border: 0; outline: none; background: none; color: #e6edf3;
           font: inherit; padding: 5px 0; max-height: 90px; }
  #send { flex: none; width: 28px; height: 28px; border: 0; border-radius: 50%;
          background: #2f81f7; color: #fff; font-size: 15px; cursor: pointer; }
  #send.stop { background: #ff6b81; font-size: 11px; }

  #hud { font-variant-numeric: tabular-nums; white-space: pre; opacity: .85; }
  #hud[hidden] { display: none; }
</style>

<svg id="pet" viewBox="0 0 160 160" data-visual="IDLE" data-signal="none">
  <g id="sparks" stroke="#ffd166" stroke-width="3" stroke-linecap="round">
    <path d="M30 40 l-10 -10" /><path d="M130 40 l10 -10" />
    <path d="M26 86 l-13 0" /><path d="M134 86 l13 0" />
  </g>
  <g id="arms" stroke="#4a90c2" stroke-width="7" stroke-linecap="round">
    <path d="M44 92 L18 112" /><path d="M116 92 L142 112" />
  </g>
  <g id="sessions"></g>
  <g id="thought" fill="#c9d1d9">
    <circle cx="116" cy="50" r="3.2" /><circle cx="127" cy="44" r="3.2" /><circle cx="138" cy="38" r="3.2" />
  </g>
  <g id="body">
    <ellipse cx="80" cy="92" rx="44" ry="40" />
    <circle class="eye" cx="64" cy="84" r="6" fill="var(--eye)" />
    <circle class="eye" cx="96" cy="84" r="6" fill="var(--eye)" />
    <g class="lid" stroke="var(--eye)" stroke-width="3" stroke-linecap="round">
      <path d="M57 84 h14" /><path d="M89 84 h14" />
    </g>
    <path id="mouth" d="M66 106 Q80 114 94 106" fill="none"
          stroke="var(--eye)" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>

<div id="hud" hidden></div>
<!-- Over the creature: click = talk, drag = move, right-click = menu. -->
<div id="drag"></div>

<div id="chat" hidden>
  <div id="bubble">
    <header><span id="who">Claude</span><button id="close" type="button" title="Close (Esc)">×</button></header>
    <div id="messages"></div>
    <div id="status"></div>
    <form id="ask">
      <textarea id="input" rows="1" placeholder="Ask Claude…"></textarea>
      <button id="send" type="submit" title="Send (Enter)">↑</button>
    </form>
  </div>
</div>

<script type="module">
  const pet = document.getElementById('pet');
  const hud = document.getElementById('hud');
  const sessionsLayer = document.getElementById('sessions');
  const SVG_NS = 'http://www.w3.org/2000/svg';

  // Pastilles on an arc above the head, centred, 16° apart, in first-seen order so a
  // session keeps its place while others come and go.
  function renderSessions(sessions) {
    const shown = sessions.slice(0, 7);
    while (sessionsLayer.childElementCount > shown.length) sessionsLayer.lastChild.remove();
    while (sessionsLayer.childElementCount < shown.length) {
      const dot = document.createElementNS(SVG_NS, 'circle');
      dot.setAttribute('r', '4.5');
      sessionsLayer.appendChild(dot);
    }
    shown.forEach((session, i) => {
      const deg = -90 + (i - (shown.length - 1) / 2) * 16;
      const rad = (deg * Math.PI) / 180;
      const dot = sessionsLayer.children[i];
      dot.setAttribute('cx', (80 + 60 * Math.cos(rad)).toFixed(1));
      dot.setAttribute('cy', (92 + 60 * Math.sin(rad)).toFixed(1));
      dot.setAttribute('class', session.status);
    });
  }

  // Debug overlay is off by default; `d` toggles it, as does #debug in the URL.
  const params = new URLSearchParams(location.hash.slice(1));
  let debug = params.has('debug');
  const applyDebug = () => { hud.hidden = !debug; };
  applyDebug();
  addEventListener('keydown', (e) => {
    if (e.key === 'd' && e.target === document.body) { debug = !debug; applyDebug(); }
  });

  // The widget host injects the endpoint; the browser harness passes it in the hash.
  const injected = window.__CLAUDE_PET__;
  if (injected !== undefined) document.documentElement.classList.add('widget');
  const token = injected?.token ?? params.get('token') ?? '';
  const base = injected?.url ?? params.get('url') ?? 'http://127.0.0.1:8787';

  // Speed tiers: calm / busy / storm. Enter a tier at its threshold, leave it 8 points lower.
  let currentTier = 0;
  function speedTier(load) {
    const up = [0, 35, 70];
    let tier = currentTier;
    while (tier < 2 && load >= up[tier + 1]) tier += 1;
    while (tier > 0 && load < up[tier] - 8) tier -= 1;
    return tier;
  }

  // ---- host bridge ---------------------------------------------------------------------
  // Everything that writes or acts goes through Rust (Tauri IPC): the menu, preference
  // writes to the daemon, the chat. The page itself only *reads* the daemon's SSE feed.
  const T = window.__TAURI__;
  const invoke = (cmd, args) => (T ? T.core.invoke(cmd, args) : Promise.reject(new Error('no host')));
  let prefs = { temperament: 'normal', chatModel: 'default', size: 'medium', showSessions: true, paused: false };

  // A release webview has no console: report to the daemon log through a GET, the
  // same kind of request as the SSE feed.
  function diag(message) {
    new Image().src = `${base}/log?token=${encodeURIComponent(token)}&m=${encodeURIComponent(message)}`;
  }

  const SIZES = { small: 110, medium: 150, large: 220 };
  let appliedWindow = '';
  function petPx() { return SIZES[prefs.size] ?? SIZES.medium; }
  function fitWindow() {
    if (chatOpen) return; // layout_panel owns the window while the chat is open
    const sq = petPx() + 30;
    if (String(sq) === appliedWindow) return;
    appliedWindow = String(sq);
    invoke('resize', { width: sq, height: sq }).catch((err) => diag(`resize: ${err}`));
  }
  function applyPrefs(p) {
    if (!p) return;
    prefs = p;
    pet.dataset.showSessions = String(p.showSessions);
    pet.dataset.paused = String(p.paused);
    document.documentElement.style.setProperty('--pet-size', `${petPx()}px`);
    fitWindow();
  }

  addEventListener('contextmenu', (e) => {
    e.preventDefault();
    invoke('show_menu', { prefs }).catch((err) => diag(`menu: ${err}`));
  });

  // ---- click to talk, drag to move ---------------------------------------------------------
  const drag = document.getElementById('drag');
  drag.addEventListener('mousedown', (down) => {
    if (down.button !== 0) return;
    let moved = false;
    const move = (m) => {
      if (Math.hypot(m.screenX - down.screenX, m.screenY - down.screenY) < 4) return;
      moved = true;
      cleanup();
      T?.window.getCurrentWindow().startDragging().catch((err) => diag(`drag: ${err}`));
    };
    const up = () => { cleanup(); if (!moved) toggleChat(); };
    const cleanup = () => { removeEventListener('mousemove', move); removeEventListener('mouseup', up); };
    addEventListener('mousemove', move);
    addEventListener('mouseup', up);
  });

  // ---- chat -----------------------------------------------------------------------------
  const chatEl = document.getElementById('chat');
  const messagesEl = document.getElementById('messages');
  const statusEl = document.getElementById('status');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const PANEL = { w: 340, h: 320 };
  let chatOpen = false;
  let chatBusy = false;
  let current = null; // the .claude element being streamed into

  // Where things go once Rust has laid the window out (see layout_panel in main.rs).
  function place(layout) {
    const sq = petPx() + 30;
    const W = window.innerWidth; // the real window width, whatever Rust settled on
    const root = document.documentElement;
    root.classList.toggle('above', layout.above);
    root.classList.toggle('below', !layout.above);
    const petLeft = layout.right ? 0 : W - sq;
    const petTop = layout.above ? PANEL.h : 0;
    Object.assign(pet.style, { left: `${petLeft + 15}px`, top: `${petTop + 15}px` });
    Object.assign(drag.style, { left: `${petLeft}px`, top: `${petTop}px`, width: `${sq}px`, height: `${sq}px` });
    const bubble = document.getElementById('bubble');
    Object.assign(bubble.style, layout.above
      ? { top: '10px', bottom: `${sq + 4}px` }
      : { top: `${sq + 4}px`, bottom: '10px' });
    bubble.style.setProperty('--tail-x', `${petLeft + sq / 2 - 10}px`);
  }

  async function toggleChat(open = !chatOpen) {
    chatOpen = open;
    const sq = petPx() + 30;
    let layout = { above: true, right: true };
    if (T) {
      try {
        layout = await invoke('layout_panel', { open, pet: sq, panelW: PANEL.w, panelH: PANEL.h });
      } catch (err) { diag(`layout: ${err}`); }
    }
    document.documentElement.classList.toggle('chat', open);
    chatEl.hidden = !open;
    if (open) {
      place(layout);
      setTimeout(() => input.focus(), 30);
    } else {
      pet.style.left = pet.style.top = '';
      for (const k of ['left', 'top', 'width', 'height']) drag.style[k] = '';
    }
  }

  const escapeHtml = (t) => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // Light markdown, on escaped text only: code blocks, inline code, bold, line breaks.
  function md(text) {
    return escapeHtml(text)
      .split(/```(?:[\w-]*)\n?/)
      .map((part, i) => (i % 2
        ? `<pre>${part.replace(/\n$/, '')}</pre>`
        : part.replace(/`([^`\n]+)`/g, '<code>$1</code>')
              .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
              .replace(/\n/g, '<br>')))
      .join('');
  }
  function addMessage(cls, html) {
    const el = document.createElement('div');
    el.className = cls;
    el.innerHTML = html;
    messagesEl.appendChild(el);
    while (messagesEl.childElementCount > 20) messagesEl.firstChild.remove(); // memory only, bounded
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return el;
  }
  function setBusy(value) {
    chatBusy = value;
    sendBtn.classList.toggle('stop', value);
    sendBtn.textContent = value ? '■' : '↑';
    sendBtn.title = value ? 'Stop' : 'Send (Enter)';
    last = ''; // re-render the creature now: its own Claude is (not) working
    if (lastFrame) render(lastFrame);
  }

  function onChat(ev) {
    switch (ev.kind) {
      case 'open': toggleChat(true); break;
      case 'reset': messagesEl.replaceChildren(); statusEl.textContent = 'New conversation'; break;
      case 'start':
        current = addMessage('claude typing', '…');
        current.dataset.text = '';
        statusEl.textContent = 'Thinking…';
        setBusy(true);
        break;
      case 'delta':
        if (!current) break;
        current.dataset.text += ev.text;
        current.classList.remove('typing');
        current.innerHTML = md(current.dataset.text);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        statusEl.textContent = 'Writing…';
        break;
      case 'tool': statusEl.textContent = `Using ${ev.name}…`; break;
      case 'done':
        if (current && !current.dataset.text) { current.classList.remove('typing'); current.innerHTML = md(ev.text); }
        statusEl.textContent = [
          ev.isError ? 'Error' : '',
          ev.durationMs != null ? `${(ev.durationMs / 1000).toFixed(1)} s` : '',
          ev.costUsd != null ? `$${ev.costUsd.toFixed(3)}` : '',
        ].filter(Boolean).join(' · ');
        current = null;
        setBusy(false);
        break;
      case 'error':
        if (current && !current.dataset.text) current.remove();
        current = null;
        statusEl.textContent = `⚠ ${ev.message}`;
        setBusy(false);
        break;
    }
  }
  T?.event.listen('chat', (e) => onChat(e.payload));

  function send() {
    if (chatBusy) { invoke('chat_cancel'); return; }
    const text = input.value.trim();
    if (!text) return;
    addMessage('you', escapeHtml(text));
    input.value = '';
    input.style.height = '';
    invoke('chat_ask', { text }).catch((err) => onChat({ kind: 'error', message: String(err) }));
  }
  document.getElementById('ask').addEventListener('submit', (e) => { e.preventDefault(); send(); });
  document.getElementById('close').addEventListener('click', () => toggleChat(false));
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = `${Math.min(input.scrollHeight, 90)}px`;
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && chatOpen) toggleChat(false); });

  // Browser-harness demo, to review the design without a Tauri host:
  //   index.html#demo=chat&layout=above-right  (or below-left, …)
  if (params.get('demo') === 'chat') {
    const [v, h] = (params.get('layout') ?? 'above-right').split('-');
    chatOpen = true;
    document.documentElement.classList.add('chat', 'widget');
    document.body.style.background = '#3b4252';
    chatEl.hidden = false;
    place({ above: v === 'above', right: h === 'right' });
    addMessage('you', 'tu peux me résumer le README du projet ?');
    addMessage('claude', md("Bien sûr ! **claude-pet** est une créature de bureau qui visualise l'activité observable de Claude Code.\n\nPour lancer le daemon : `npm run daemon`"));
    addMessage('you', 'et la commande pour les tests ?');
    addMessage('claude typing', '…');
    statusEl.textContent = 'Using Bash…';
    chatBusy = true;
    sendBtn.classList.add('stop');
    sendBtn.textContent = '■';
  }

  // Frames arrive every 100 ms–1 s; touching the DOM only on change keeps an idle page idle.
  let last = '';
  let lastFrame = null;
  function render(s) {
    lastFrame = s;
    applyPrefs(s.prefs);
    const key = JSON.stringify([chatBusy, s.visual, s.load, s.state, s.context_load, s.sources, s.prefs,
                                (s.sessions ?? []).map((x) => x.id + x.status),
                                s.active_subagents, debug && s.estimated_activity_rate]);
    if (key === last) return;
    last = key;
    // Paused: render as asleep whatever the engine says (it keeps running underneath, so
    // resuming is accurate at once).
    // Its own Claude answering is observable from right here (the run is ours), so it
    // shows as thinking even though that session bypasses the hooks.
    pet.dataset.visual = prefs.paused ? 'IDLE' : chatBusy && s.visual === 'IDLE' ? 'ACTIVE' : s.visual;
    pet.dataset.state = prefs.paused ? 'IDLE' : chatBusy && s.visual !== 'HIGH_LOAD' ? 'THINKING' : s.state;
    renderSessions(s.sessions ?? []);
    // "no signal" is a distinct look from "idle": see docs/RISKS.md #5.
    pet.dataset.signal = s.sources.hooks || s.sources.statusline ? 'live' : 'none';

    // Amplitude follows load continuously: changing a custom property inside running
    // keyframes is seamless. Speed does NOT: every change of animation-duration re-maps
    // the current phase and the creature visibly jumps — at one change per 100 ms tick
    // that read as "choppy". So speed moves through three tiers, with hysteresis.
    const t = s.load / 100;
    pet.style.setProperty('--amp', (0.03 + 0.17 * t).toFixed(3));
    const tier = speedTier(s.load);
    if (tier !== currentTier) {
      currentTier = tier;
      pet.style.setProperty('--dur', ['3.2s', '1.4s', '0.7s'][tier]);
    }

    const ctx = s.context_load === null ? '  —' : `${String(s.context_load).padStart(2)}%`;
    hud.textContent =
      `STATE: ${s.state.padEnd(10)} LOAD: ${String(s.load).padStart(3)}\n` +
      `EVENTS/MIN: ${String(s.estimated_activity_rate).padStart(4)}  CTX: ${ctx}\n` +
      `agents ${s.active_subagents}  conf ${s.load_confidence.toFixed(2)}  ` +
      `hooks:${s.sources.hooks ? 'y' : 'n'} net:${s.sources.net ? 'y' : 'n'} sl:${s.sources.statusline ? 'y' : 'n'}\n` +
      (s.sessions ?? []).map((x) => `${x.id} ${x.status}`).join('  ');
  }

  function connect() {
    const es = new EventSource(`${base}/events?token=${encodeURIComponent(token)}`);
    es.onmessage = (e) => { try { render(JSON.parse(e.data)); } catch { /* keep last frame */ } };
    // EventSource reconnects on its own; this only surfaces the gap to the viewer.
    es.onerror = () => { pet.dataset.signal = 'none'; };
  }
  connect();
</script>
