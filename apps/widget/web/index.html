    const label = whyBubble.querySelector('text');
    label.textContent = text;
    const natural = Math.round(textWidth(text)); // display:none can't be measured: canvas does
    const w = Math.min(156, natural + 22);
    if (natural > w - 22) label.setAttribute('textLength', String(w - 22));
    else label.removeAttribute('textLength');
    const rect = whyBubble.querySelector('rect');
    rect.setAttribute('width', String(w));
    rect.setAttribute('x', String(80 - w / 2));
    // The bubble floats just above the head it is about (a lower row's family gets it over
    // the row above), its tail's two dots leading down to that head.
    const placedAnchor = familyAnchors.get(family) ?? { x: geo.why[0], y: geo.why[1] };
    // A turning family's anchor has turned with it (its orbit is held while the bubble shows).
    const anchor = rotateAround(placedAnchor, orbitCentre, orbitAngle(planeMap.get(family)?.plane));
    const dy = Math.min(Math.max(0, anchor.y - 26), 120);
    whyBubble.setAttribute('transform', `translate(0 ${dy.toFixed(1)})`);
    const [near, far] = whyBubble.querySelectorAll('circle');
    near.setAttribute('cx', String((80 * 0.4 + anchor.x * 0.6).toFixed(1)));
    near.setAttribute('cy', '16');
    far.setAttribute('cx', String(anchor.x.toFixed(1)));
    far.setAttribute('cy', '24');
  }

  // Debug overlay is off by default; `d` toggles it, as does #debug in the URL.
  const params = new URLSearchParams(location.hash.slice(1));
  let debug = params.has('debug');
  const applyDebug = () => { hud.hidden = !debug; };
  applyDebug();
  addEventListener('keydown', (e) => {
    if (e.key === 'd' && e.target === document.body) { debug = !debug; applyDebug(); }
  });

  // The widget host injects the endpoint; the browser harness passes it in the hash.
  const injected = window.__CLAUDE_PET__;
  if (injected !== undefined) document.documentElement.classList.add('widget');
  const token = injected?.token ?? params.get('token') ?? '';
  const base = injected?.url ?? params.get('url') ?? 'http://127.0.0.1:8787';

  // Speed tiers: calm / busy / storm. Enter a tier at its threshold, leave it 8 points lower.
  let currentTier = 0;
  function speedTier(load) {
    const up = [0, 35, 70];
    let tier = currentTier;
    while (tier < 2 && load >= up[tier + 1]) tier += 1;
    while (tier > 0 && load < up[tier] - 8) tier -= 1;
    return tier;
  }

  // ---- host bridge ---------------------------------------------------------------------
  // Everything that writes or acts goes through Rust (Tauri IPC): the menu, preference
  // writes to the daemon, the chat. The page itself only *reads* the daemon's SSE feed.
  const T = window.__TAURI__;
  const invoke = (cmd, args) => (T ? T.core.invoke(cmd, args) : Promise.reject(new Error('no host')));
  let prefs = { temperament: 'normal', chatModel: 'default', size: 'medium', sizePx: 150, showSessions: true, paused: false };

  // A release webview has no console: report to the daemon log through a GET, the
  // same kind of request as the SSE feed.
  function diag(message) {
    new Image().src = `${base}/log?token=${encodeURIComponent(token)}&m=${encodeURIComponent(message)}`;
  }

  let appliedSize = 0;
  // While the size slider is in hand or its value on the way, it is the size: the live
  // preview must not snap back to the saved one carried by every frame.
  // Shown size = nominal × zoom, kept between min and max (same rule as the daemon's).
  // A size control in hand or on its way previews live.
  function petPx() {
    const live = (key, fallback) => {
      const r = ROWS.get(key);
      if (r && (r.held || r.pending !== undefined)) return Number(r.input.value);
      return Number.isFinite(prefs[key]) ? prefs[key] : fallback;
    };
    const lo = Math.min(live('minPx', 80), live('maxPx', 300));
    const hi = Math.max(live('minPx', 80), live('maxPx', 300));
    const anyLive = ['nominalPx', 'zoom', 'minPx', 'maxPx'].some((k) => ROWS.get(k)?.held || ROWS.get(k)?.pending !== undefined);
    if (!anyLive && Number.isFinite(prefs.sizePx)) return prefs.sizePx;
    return Math.round(Math.min(hi, Math.max(lo, live('nominalPx', 150) * live('zoom', 1))));
  }
  function applySize() {
    const px = petPx();
    if (px === appliedSize) return;
    appliedSize = px;
    document.documentElement.style.setProperty('--pet-size', `${px}px`);
    const sq = px + 30;
    if (!chatOpen) {
      invoke('resize', { width: sq, height: sq }).catch((err) => diag(`resize: ${err}`));
      return;
    }
    // The chat is open: lay the panel out again around the new square (layout_panel
    // keeps the creature's corner where it is).
    invoke('layout_panel', { open: true, pet: sq, panelW: PANEL.w, panelH: PANEL.h })
      .then((layout) => { if (chatOpen) place(layout); })
      .catch((err) => diag(`layout: ${err}`));
  }
  // ---- avatar -----------------------------------------------------------------------------
  // Behavior first, avatar CSS after: on equal specificity the avatar's rules win.
  const behaviorStyle = document.createElement('style');
  behaviorStyle.id = 'behavior-css';
  behaviorStyle.textContent = compileBehavior(DEFAULT_BEHAVIOR);
  document.head.appendChild(behaviorStyle);
  const avatarStyle = document.createElement('style');
  avatarStyle.id = 'avatar-css';
  document.head.appendChild(avatarStyle);
  let avatarId = 'classic';
  let avatarLoading = '';

  /** Swap the creature's prototype; the next render rebuilds every creature from it. */
  function setAvatar(id, protoEl, avatarGeo, css, animations, ownKf) {
    avatarId = id;
    proto = protoEl;
    geo = avatarGeo;
    avatarStyle.textContent = css;
    // The avatar's motion: its profile plus its per-state overrides, compiled scoped on
    // top of the default behavior. Dropped entries fall back to the default and say why.
    const { override, dropped } = behaviorFromManifest(animations, ownKf);
    for (const why of dropped) diag(`avatar ${id} animations: ${why}`);
    const merged = mergeBehavior(PROFILES[animations?.profile] ?? DEFAULT_BEHAVIOR, override);
    const mapKf = (n) => (ownKf?.has(n) ? `av-${id}-${n}` : n);
    behaviorStyle.textContent = id === 'classic'
      ? compileBehavior(DEFAULT_BEHAVIOR)
      : compileBehavior(DEFAULT_BEHAVIOR) + compileBehavior(merged, `.critter[data-avatar="${id}"]`, mapKf);
    entering = enterStates(id === 'classic' ? DEFAULT_BEHAVIOR : merged);
    enterKfs = new Set([...enterNames(DEFAULT_BEHAVIOR), ...enterNames(merged, mapKf)]);
    crittersKey = '';
    critterEls.clear();
    parentSlots.clear();
    last = '';
    if (lastFrame) render(lastFrame);
  }

  /** Build an avatar from what the host (or the harness) delivers; classic on any failure. */
  function applyAvatar(avatar) {
    try {
      const protoEl = avatar.kind === 'svg' ? buildSvgProto(document, avatar) : buildImageProto(document, avatar);
      // Both kinds may ship CSS: it is how pictures get motion too.
      const css = avatar.css ? scopeCss(avatar.css, avatar.id) : '';
      const ownKf = avatar.css ? keyframeNames(avatar.css) : new Set();
      setAvatar(avatar.id, protoEl, { ...DEFAULT_GEO, ...(avatar.anchors ?? {}), hitbox: avatar.hitbox }, css, avatar.animations, ownKf);
    } catch (err) {
      diag(`avatar ${avatar.id}: ${err.message}`);
      setAvatar('classic', classicProto, DEFAULT_GEO, '');
    }
  }

  function loadAvatar(id) {
    if (!id || id === avatarId || id === avatarLoading) return;
    if (id === 'classic') { setAvatar('classic', classicProto, DEFAULT_GEO, ''); return; }
    if (!T) return;
    avatarLoading = id;
    invoke('get_avatar', { id })
      .then((avatar) => applyAvatar(avatar))
      .catch((err) => {
        diag(`avatar ${id}: ${err}`);
        setAvatar('classic', classicProto, DEFAULT_GEO, '');
      })
      .finally(() => { avatarLoading = ''; });
  }

  // A .claudepet dropped on the creature (installed by the host): say so in the why bubble
  // for a few seconds, and reload even when it replaced the avatar already on screen.
  let flashTimer = 0;
  function flash(text) {
    clearTimeout(flashTimer);
    renderWhy({ text, family: '' });
    flashTimer = setTimeout(() => { last = ''; if (lastFrame) render(lastFrame); }, 4_000);
  }
  T?.event.listen('avatar-removed', ({ payload }) => {
    flash(t('avatar.removed', { name: String(payload.name).slice(0, 24) }));
  });
  T?.event.listen('avatar', ({ payload }) => {
    if (payload.ok) {
      avatarId = '';
      loadAvatar(payload.id);
      flash(t('avatar.flash', { name: String(payload.name).slice(0, 24) }));
    } else {
      flash(t('avatar.refused'));
      diag(`avatar import: ${payload.error}`);
    }
  });

  // A refused save says why in words: an unreadable config.json is the one worth naming.
  const saveError = (err) => {
    diag(`settings: ${err}`);
    return String(err).includes('config_invalid') ? t('settings.configInvalid') : t('settings.notSaved');
  };

  let appliedLocale = '';
  // A click on the creature: the chat when it is on; otherwise it says how to turn it on.
  function clickCreature() {
    if (chatOpen) { toggleChat(false); return; }
    if (prefs.chatEnabled) openPanel('chat');
    else flash(t('chat.offHint'));
  }

  // Window and comfort prefs that live in the page: theme, motion, opacity, on-top.
  const darkMq = matchMedia('(prefers-color-scheme: dark)');
  const motionMq = matchMedia('(prefers-reduced-motion: reduce)');
  let motionReduced = false;
  let appliedOnTop = null;
  function applyComfort() {
    const root = document.documentElement;
    root.dataset.theme = prefs.theme === 'light' || (prefs.theme !== 'dark' && !darkMq.matches) ? 'light' : 'dark';
    motionReduced = prefs.reduceMotion === 'on' || (prefs.reduceMotion !== 'off' && motionMq.matches);
    root.dataset.reduceMotion = String(motionReduced);
    pet.style.opacity = String(Number.isFinite(prefs.opacity) ? prefs.opacity : 1);
    if (T && typeof prefs.alwaysOnTop === 'boolean' && prefs.alwaysOnTop !== appliedOnTop) {
      appliedOnTop = prefs.alwaysOnTop;
      invoke('set_always_on_top', { on: prefs.alwaysOnTop }).catch((err) => diag(`on top: ${err}`));
    }
    // The gear (switch to the conversation) only makes sense with the chat on.
    bubbleEl.dataset.chat = prefs.chatEnabled ? 'on' : 'off';
    if (!prefs.chatEnabled && chatOpen && !bubbleEl.classList.contains('settings')) toggleChat(false);
  }
  darkMq.addEventListener('change', applyComfort);
  motionMq.addEventListener('change', () => { applyComfort(); last = ''; });

  let appliedPrefs = '';
  function applyPrefs(p) {
    if (!p) return;
    // Every frame (up to 10 a second) carries the prefs; they change a few times a day.
    // The settings rows still look at each frame: a value on its way waits for one to agree.
    const json = JSON.stringify(p);
    if (json === appliedPrefs) {
      if (ROWS.size) renderSettings(p);
      return;
    }
    appliedPrefs = json;
    const chatWas = prefs.chatEnabled;
    prefs = p;
    applyComfort();
    if (chatWas !== p.chatEnabled && ROWS.size) buildSettings(); // the chat row's note changes
    const locale = setLocale(p.locale ?? 'auto');
    if (locale !== appliedLocale) {
      appliedLocale = locale;
      if (T) invoke('set_locale', { locale }).catch((err) => diag(`locale: ${err}`));
      translateDom();
      if (ROWS.size) buildSettings(); // the panel in the new language
      last = ''; // re-render: why bubble, tooltips, gauge in the new language
    }
    loadAvatar(p.avatar ?? 'classic');
    renderSettings(p);
    pet.dataset.showSessions = String(p.showSessions);
    pet.dataset.paused = String(p.paused);
    applySize();
  }

  addEventListener('contextmenu', (e) => {
    e.preventDefault();
    invoke('show_menu', { prefs, locale: currentLocale(), update: lastFrame?.update ?? null }).catch((err) => diag(`menu: ${err}`));
  });

  // ---- click to talk, drag to move ---------------------------------------------------------
  const drag = document.getElementById('drag');
  drag.addEventListener('mousedown', (down) => {
    if (down.button !== 0) return;
    let moved = false;
    const move = (m) => {
      if (Math.hypot(m.screenX - down.screenX, m.screenY - down.screenY) < 4) return;
      moved = true;
      cleanup();
      T?.window.getCurrentWindow().startDragging().catch((err) => diag(`drag: ${err}`));
    };
    const up = () => { cleanup(); if (!moved) clickCreature(); };
    const cleanup = () => { removeEventListener('mousemove', move); removeEventListener('mouseup', up); };
    addEventListener('mousemove', move);
    addEventListener('mouseup', up);
  });

  // ---- chat -----------------------------------------------------------------------------
  const chatEl = document.getElementById('chat');
  const messagesEl = document.getElementById('messages');
  const statusEl = document.getElementById('status');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const PANEL = { w: 340, h: 320 };
  let chatOpen = false;
  let chatBusy = false;
  let current = null; // the .claude element being streamed into

  // Where things go once Rust has laid the window out (see layout_panel in main.rs).
  function place(layout) {
    const sq = petPx() + 30;
    const W = window.innerWidth; // the real window width, whatever Rust settled on
    const root = document.documentElement;
    root.classList.toggle('above', layout.above);
    root.classList.toggle('below', !layout.above);
    const petLeft = layout.right ? 0 : W - sq;
    const petTop = layout.above ? PANEL.h : 0;
    Object.assign(pet.style, { left: `${petLeft + 15}px`, top: `${petTop + 15}px` });
    Object.assign(drag.style, { left: `${petLeft}px`, top: `${petTop}px`, width: `${sq}px`, height: `${sq}px` });
    const bubble = document.getElementById('bubble');
    Object.assign(bubble.style, layout.above
      ? { top: '10px', bottom: `${sq + 4}px` }
      : { top: `${sq + 4}px`, bottom: '10px' });
    bubble.style.setProperty('--tail-x', `${petLeft + sq / 2 - 10}px`);
  }

  /** Open the panel on the conversation or the settings, or close it (null). */
  async function openPanel(mode) {
    if (mode === 'chat' && !prefs.chatEnabled) mode = null; // native-gated: see main.rs
    if (mode && chatOpen) { showSettings(mode === 'settings'); return; } // just switch
    if (mode) showSettings(mode === 'settings');
    await toggleChat(Boolean(mode));
  }

  async function toggleChat(open = !chatOpen) {
    if (open && !prefs.chatEnabled && !bubbleEl.classList.contains('settings')) open = false;
    chatOpen = open;
    reportPanel(open); // in the menu bar alone, the window shows for the panel and hides after
    if (!open) showSettings(false); // it opens on the conversation next time
    const sq = petPx() + 30;
    let layout = { above: true, right: true };
    if (T) {
      try {
        layout = await invoke('layout_panel', { open, pet: sq, panelW: PANEL.w, panelH: PANEL.h });
      } catch (err) { diag(`layout: ${err}`); }
    }
    document.documentElement.classList.toggle('chat', open);
    chatEl.hidden = !open;
    if (open) {
      place(layout);
      if (!bubbleEl.classList.contains('settings')) setTimeout(() => input.focus(), 30);
    } else {
      pet.style.left = pet.style.top = '';
      for (const k of ['left', 'top', 'width', 'height']) drag.style[k] = '';
    }
  }

  const escapeHtml = (t) => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // Light markdown, on escaped text only: code blocks, inline code, bold, line breaks.
  function md(text) {
    return escapeHtml(text)
      .split(/```(?:[\w-]*)\n?/)
      .map((part, i) => (i % 2
        ? `<pre>${part.replace(/\n$/, '')}</pre>`
        : part.replace(/`([^`\n]+)`/g, '<code>$1</code>')
              .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
              .replace(/\n/g, '<br>')))
      .join('');
  }
  function addMessage(cls, html) {
    const el = document.createElement('div');
    el.className = cls;
    el.innerHTML = html;
    messagesEl.appendChild(el);
    while (messagesEl.childElementCount > 20) messagesEl.firstChild.remove(); // memory only, bounded
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return el;
  }
  function setBusy(value) {
    chatBusy = value;
    document.getElementById('bubble').classList.toggle('busy', value);
    sendBtn.classList.toggle('stop', value);
    sendBtn.textContent = value ? '■' : '↑';
    sendBtn.title = t(value ? 'chat.stop' : 'chat.send');
    sendBtn.setAttribute('aria-label', sendBtn.title);
    last = ''; // re-render the creature now: its own Claude is (not) working
    if (lastFrame) render(lastFrame);
  }

  // Rust sends error codes; the words are ours, in the user's language. Anything else is
  // a raw technical message: a generic line on screen, the detail in the log.
  const CHAT_ERRORS = new Set(['already_answering', 'claude_not_found', 'cannot_start', 'chat_disabled', 'empty_message', 'stopped']);
  const chatError = (code) => t(`chat.error.${CHAT_ERRORS.has(code) ? code : 'other'}`);

  function onChat(ev) {
    switch (ev.kind) {
      case 'open': openPanel('chat'); break;
      case 'reset': messagesEl.replaceChildren(); statusEl.textContent = t('chat.newConversation'); break;
      case 'start':
        current = addMessage('claude typing', '…');
        current.dataset.text = '';
        statusEl.textContent = t('chat.thinking');
        setBusy(true);
        break;
      case 'delta':
        if (!current) break;
        current.dataset.text += ev.text;
        current.classList.remove('typing');
        current.innerHTML = md(current.dataset.text);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        statusEl.textContent = t('chat.writing');
        break;
      case 'tool': statusEl.textContent = t('chat.using', { tool: ev.name }); break;
      case 'done':
        if (current && !current.dataset.text) { current.classList.remove('typing'); current.innerHTML = md(ev.text); }
        statusEl.textContent = [
          ev.isError ? t('chat.failed') : '',
          ev.durationMs != null ? fmt.seconds(ev.durationMs) : '',
          ev.costUsd != null ? fmt.usd(ev.costUsd) : '',
        ].filter(Boolean).join(' · ');
        current = null;
        setBusy(false);
        break;
      case 'error':
        if (current && !current.dataset.text) current.remove();
        current = null;
        statusEl.textContent = `⚠ ${chatError(ev.code ?? ev.message)}`;
        if (ev.message) diag(`chat: ${ev.message}`);
        setBusy(false);
        break;
    }
  }
  T?.event.listen('chat', (e) => onChat(e.payload));

  function send() {
    if (chatBusy) { invoke('chat_cancel'); return; }
    const text = input.value.trim();
    if (!text) return;
    addMessage('you', escapeHtml(text));
    input.value = '';
    input.style.height = '';
    invoke('chat_ask', { text }).catch((err) => onChat({ kind: 'error', code: String(err) }));
  }
  document.getElementById('ask').addEventListener('submit', (e) => { e.preventDefault(); send(); });
  document.getElementById('close').addEventListener('click', () => toggleChat(false));

  // ---- settings panel -----------------------------------------------------------------
  // One row per setting of settings-schema.json (handed over by Rust; the harness fetches
  // it), grouped by section, worded in the current language. A change goes to Rust, which
  // drops what the page may not write (turning the chat on), then to the daemon, which
  // validates and saves; the saved values come back on the feed.
  const bubbleEl = document.getElementById('bubble');
  const gear = document.getElementById('gear');
  const settingsEl = document.getElementById('settings');
  const formEl = document.getElementById('settings-form');
  const settingsStatus = document.getElementById('settings-status');
  const ROWS = new Map(); // key → { spec, input, out }
  let schema = [];
  let avatarsList = [];

  const unitOf = {
    nominalPx: (v) => `${fmt.number(v)} px`, minPx: (v) => `${fmt.number(v)} px`, maxPx: (v) => `${fmt.number(v)} px`,
    zoom: (v) => `×${fmt.number(v, 1)}`, opacity: (v) => fmt.percent(v * 100),
    minStateSeconds: (v) => fmt.seconds(v * 1000), stormThreshold: (v) => fmt.number(v),
  };
  // Enum values already worded in the menu reuse those words.
  const valueLabel = (key, value) => (key === 'temperament' ? t(`menu.temperament.${value}`)
    : key === 'chatModel' ? t(`menu.model.${value}`) : t(`set.${key}.${value}`));

  function buildSettings() {
    formEl.replaceChildren();
    ROWS.clear();
    let section = '';
    for (const spec of schema) {
      if (!spec.section) continue;
      if (spec.section !== section) {
        section = spec.section;
        const h = document.createElement('h3');
        h.textContent = t(`set.section.${section}`);
        formEl.append(h);
      }
      const row = document.createElement('div');
      row.className = 'setting';
      const label = document.createElement('label');
      label.textContent = t(`set.${spec.key}.label`);
      label.htmlFor = `set-${spec.key}`;
      let input;
      let out = null;
      if (spec.type === 'bool') {
        input = Object.assign(document.createElement('input'), { type: 'checkbox' });
      } else if (spec.type === 'enum' || spec.type === 'id') {
        input = document.createElement('select');
        const options = spec.type === 'id' ? avatarsList.map((a) => [a.id, a.name]) : spec.values.map((v) => [v, valueLabel(spec.key, v)]);
        for (const [value, text] of options) input.append(new Option(text, value));
      } else {
        input = Object.assign(document.createElement('input'), { type: 'range', min: spec.min, max: spec.max, step: spec.step ?? 1 });
        out = document.createElement('output');
      }
      input.id = `set-${spec.key}`;
      const doc = document.createElement('p');
      doc.textContent = spec.key === 'chatEnabled' && !prefs.chatEnabled ? `${t(`set.${spec.key}.doc`)} ${t('settings.chatOnlyFromMenu')}` : t(`set.${spec.key}.doc`);
      row.append(label, out ?? input);
      if (out) row.append(input);
      row.append(doc);
      if (spec.type !== 'bool' && spec.type !== 'id') {
        const reset = Object.assign(document.createElement('button'), { type: 'button', className: 'reset', textContent: t('settings.default') });
        reset.addEventListener('click', () => save(spec.key, null));
        row.append(reset);
      }
      const r = { spec, input, out, held: false, pending: undefined, pendingUntil: 0 };
      ROWS.set(spec.key, r);
      if (out) {
        input.addEventListener('pointerdown', () => { r.held = true; });
        input.addEventListener('input', () => { out.textContent = (unitOf[spec.key] ?? String)(Number(input.value)); applySize(); });
        input.addEventListener('change', () => { r.held = false; save(spec.key, Number(input.value)); input.blur(); });
      } else {
        input.addEventListener('change', () => save(spec.key, spec.type === 'bool' ? input.checked : input.value));
      }
      formEl.append(row);
    }
    renderSettings(prefs);
  }
  addEventListener('pointerup', () => { for (const r of ROWS.values()) r.held = false; });

  // Every frame (100 ms–1 s) carries the saved prefs. A control must not be pushed back to
  // them while in the user's hand, nor while a new value is on its way (`pending`, until a
  // frame agrees or 3 s pass).
  function renderSettings(p) {
    for (const [key, r] of ROWS) {
      const value = p[key];
      if (value === undefined) continue;
      if (r.pending !== undefined && (value === r.pending || Date.now() > r.pendingUntil)) r.pending = undefined;
      if (r.held || r.pending !== undefined) continue;
      if (r.spec.type === 'bool') r.input.checked = Boolean(value);
      else r.input.value = String(value);
      if (r.out) r.out.textContent = (unitOf[key] ?? String)(Number(r.input.value));
      // The page can turn the chat off, never on (Rust refuses it): grey it out when off.
      if (key === 'chatEnabled') r.input.disabled = !value;
    }
  }

  async function save(key, value) {
    const r = ROWS.get(key);
    if (r) { r.pending = value ?? undefined; r.pendingUntil = Date.now() + 3000; }
    settingsStatus.textContent = t('settings.saving');
    try {
      applyPrefs(await invoke('update_prefs', { patch: { [key]: value } }));
      settingsStatus.textContent = t('settings.saved');
    } catch (err) {
      if (r) r.pending = undefined;
      settingsStatus.textContent = String(err).includes('chat_native_only') ? t('chat.error.chat_native_only') : saveError(err);
      renderSettings(prefs);
    }
  }

  async function loadSchema() {
    try {
      const text = T ? await invoke('settings_schema')
        : await (await fetch(new URL('../../../packages/collector/src/settings-schema.json', location.href))).text();
      schema = JSON.parse(text).prefs;
      avatarsList = T ? await invoke('list_avatars', { locale: currentLocale() }) : [{ id: 'classic', name: t('menu.avatar.classic') }];
    } catch (err) { diag(`settings schema: ${err}`); }
    buildSettings();
  }

  function showSettings(open) {
    bubbleEl.classList.toggle('settings', open);
    settingsEl.hidden = !open;
    gear.setAttribute('aria-pressed', String(open));
    document.getElementById('who').textContent = t(open ? 'chat.settings' : 'chat.header');
    settingsStatus.textContent = '';
    if (open) void loadSchema(); // fresh avatar list and words each time it opens
  }
  // The gear switches between the conversation and the settings — only with the chat on.
  gear.addEventListener('click', () => showSettings(!bubbleEl.classList.contains('settings')));
  document.getElementById('advanced').addEventListener('click', () => {
    invoke('open_advanced').catch((err) => diag(`advanced: ${err}`));
  });

  // ---- zoom: ⌘+ / ⌘− / ⌘0 on the creature, or the menu ------------------------------
  function zoom(dir) {
    const current = Number.isFinite(prefs.zoom) ? prefs.zoom : 1;
    if (dir === 'reset') { save('zoom', null); return; }
    const next = Math.round(Math.min(2, Math.max(0.5, current + (dir === 'in' ? 0.1 : -0.1))) * 10) / 10;
    if (next !== current) save('zoom', next);
  }
  T?.event.listen('zoom', ({ payload }) => zoom(payload.dir));
  addEventListener('keydown', (e) => {
    if (!e.metaKey || e.target === input) return;
    if (e.key === '=' || e.key === '+') { e.preventDefault(); zoom('in'); }
    else if (e.key === '-') { e.preventDefault(); zoom('out'); }
    else if (e.key === '0') { e.preventDefault(); zoom('reset'); }
  });
  T?.event.listen('panel', ({ payload }) => openPanel(payload.mode));

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = `${Math.min(input.scrollHeight, 90)}px`;
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && chatOpen) toggleChat(false); });

  // Browser-harness demo, to review the design without a Tauri host:
  //   index.html#demo=chat&layout=above-right  (or below-left, …)
  // Browser-harness demo of an avatar (run Chrome with --allow-file-access-from-files):
  //   index.html#demo=avatar&avatar=ghost&state=THINKING[&kids=2][&signal=none][&ctx=92]
  //     [&sessions=CODING,WAITING,READING] one family per state (kids go to the first one)
  //     [&gauge=63] the usage gauge, % of the 5-hour window   [&bg=%23101418] the backdrop   [&size=220] px
  //     [&spacing=tight|normal|roomy] [&layout=grid|gravity] [&wander=off] [&orbitSpeed=4] (demo only)
  // It reads the avatar folder like the widget's importer would, minus the validation — from the
  // library's clone next to this one (r45635/claude-pet-avatars → ../claude-pet-avatars).
  if (params.get('demo') === 'avatar') {
    (async () => {
      await null; // let the rest of the module initialise first (render's state is below)
      const id = params.get('avatar') ?? 'classic';
      const state = params.get('state') ?? 'IDLE';
      const kids = Number(params.get('kids') ?? 0);
      const ctx = params.has('ctx') ? Number(params.get('ctx')) : null; // fatigue: &ctx=0..100
      document.documentElement.classList.add('widget');
      document.body.style.background = params.get('bg') ?? '#3b4252';
      if (id !== 'classic') {
        const root = new URL(`../../../../claude-pet-avatars/avatars/${id}/`, location.href);
        const format = await (await fetch(new URL('../../../packages/collector/src/avatar-format.json', location.href))).json();
        const manifest = await (await fetch(new URL('manifest.json', root))).json();
        const text = async (f) => (await fetch(new URL(f, root))).text();
        const dataUrl = async (f) => {
          const blob = await (await fetch(new URL(f, root))).blob();
          const type = format.imageTypes[f.split('.').pop().toLowerCase()];
          return new Promise((ok) => { const fr = new FileReader(); fr.onload = () => ok(fr.result.replace(/^data:[^;]*/, `data:${type}`)); fr.readAsDataURL(blob); });
        };
        const avatar = { id, kind: manifest.kind, anchors: manifest.anchors, hitbox: manifest.hitbox,
                         animations: manifest.animations };
        if (manifest.css) avatar.css = await text(manifest.css);
        if (manifest.kind === 'svg') {
          avatar.svg = await text(manifest.svg);
        } else {
          const files = resolveStates(manifest.states, format.fallback, format.states);
          avatar.images = {};
          for (const [st, f] of Object.entries(files)) avatar.images[st] = await dataUrl(f);
        }
        applyAvatar(avatar);
      }
      const agents = Array.from({ length: kids }, (_, i) => ({ id: `k${i}`, type: 'explore', state }));
      const STATUS = { WAITING: 'waiting', DONE: 'done', IDLE: 'idle', THINKING: 'thinking' };
      const families = (params.get('sessions') ?? '').split(',').filter(Boolean)
        .map((st, i) => ({ id: `s${i}`, status: STATUS[st] ?? 'working', state: st, load: st === 'HIGH_LOAD' ? 90 : 50,
                           agents: i === 0 ? agents : [], context_load: ctx,
                           reason: st === 'ERROR' ? { kind: 'tool_failed', tool: 'bash' } : st === 'HIGH_LOAD' ? { kind: 'storm', driver: 'agent' } : null }));
      const gauge = params.has('gauge') ? { used_pct: Number(params.get('gauge')), resets_at: new Date(Date.now() + 2.4 * 3600_000).toISOString() } : null;
      render({
        rate_limits: { five_hour: gauge, seven_day: null },
        state, visual: state === 'IDLE' ? 'IDLE' : state === 'HIGH_LOAD' || state === 'ERROR' ? state : 'ACTIVE',
        load: state === 'HIGH_LOAD' ? 90 : state === 'IDLE' ? 0 : 50,
        reason: state === 'HIGH_LOAD' ? { kind: 'storm', driver: 'agent' }
          : state === 'ERROR' ? { kind: 'tool_failed', tool: 'bash' } : null,
        sources: { hooks: params.get('signal') !== 'none', statusline: false, net: false },
        sessions: families.length ? families : kids ? [{ id: 'demo', status: 'working', state, load: state === 'HIGH_LOAD' ? 90 : 50, agents, context_load: ctx,
                                                       reason: state === 'HIGH_LOAD' ? { kind: 'storm', driver: 'agent' } : null }] : [],
        prefs: { ...prefs, avatar: id, locale: params.get('lang') ?? 'auto', sizePx: Number(params.get('size') ?? 150),
                 spacing: params.get('spacing') ?? 'normal', wander: params.get('wander') !== 'off', layout: params.get('layout') ?? 'grid' }, estimated_activity_rate: 0, load_confidence: 1, context_load: ctx,
        active_subagents: kids, tool_calls_per_minute: 0, tokens_per_minute: null,
      });
      document.title = `ready ${id} ${state}`;
    })().catch((err) => { document.title = `failed ${err.message}`; });
  }

  // Browser-harness demo of the settings panel: #demo=settings&lang=fr&theme=light[&chat=on]
  if (params.get('demo') === 'settings') {
    prefs = { ...prefs, locale: params.get('lang') ?? 'auto', theme: params.get('theme') ?? 'dark', reduceMotion: 'system',
              launchAtLogin: true, avatar: 'classic', nominalPx: 150, minPx: 80, maxPx: 300, zoom: 1.2, opacity: 1,
              alwaysOnTop: true, showSessions: true, temperament: 'normal', stormThreshold: 75, minStateSeconds: 2,
              paused: false, netSensor: true, readTranscripts: false, chatEnabled: params.get('chat') === 'on', chatModel: 'default' };
    setLocale(prefs.locale);
    translateDom();
    applyComfort();
    chatOpen = true;
    document.documentElement.classList.add('chat', 'widget');
    document.body.style.background = '#3b4252';
    chatEl.hidden = false;
    place({ above: true, right: true });
    showSettings(true);
  }

  if (params.get('demo') === 'chat') {
    setLocale(params.get('lang') ?? 'auto');
    translateDom();
    const [v, h] = (params.get('layout') ?? 'above-right').split('-');
    chatOpen = true;
    document.documentElement.classList.add('chat', 'widget');
    document.body.style.background = '#3b4252';
    chatEl.hidden = false;
    place({ above: v === 'above', right: h === 'right' });
    addMessage('you', 'tu peux me résumer le README du projet ?');
    addMessage('claude', md("Bien sûr ! **claude-pet** est une créature de bureau qui visualise l'activité observable de Claude Code.\n\nPour lancer le daemon : `npm run daemon`"));
    addMessage('you', 'et la commande pour les tests ?');
    addMessage('claude typing', '…');
    statusEl.textContent = t('chat.using', { tool: 'Bash' });
    chatBusy = true;
    sendBtn.classList.add('stop');
    sendBtn.textContent = '■';
  }

  // Frames arrive every 100 ms–1 s; touching the DOM only on change keeps an idle page idle.
  let last = '';
  let lastFrame = null;

  // Updates (docs/RISKS.md #12): the daemon detects and installs; the page only says so,
  // once per event — a new version seen, an install that failed, a restart onto a new one.
  let updateSeen = '';
  let wasInstalling = false;
  let versionChecked = false;
  const VERSION_KEY = 'claude-pet.version';
  function noticeUpdate(s) {
    const u = s.update;
    if (u?.available && u.latest && u.latest !== updateSeen && !u.installing) {
      updateSeen = u.latest;
      flash(t('update.available', { v: u.latest }));
    }
    if (wasInstalling && u && !u.installing && u.error) flash(t('update.failed'));
    wasInstalling = !!u?.installing;
    if (s.version && !versionChecked) {
      versionChecked = true; // once per page load: a restart onto a new version is a new page
      let before = null;
      try { before = localStorage.getItem(VERSION_KEY); localStorage.setItem(VERSION_KEY, s.version); } catch { /* storage off */ }
      if (before && before !== s.version) flash(t('update.done', { v: `v${s.version}` }));
    }
  }

  // `claude-pet avatars install|update|remove` changes avatars outside the widget: reload the
  // one on screen when the daemon says something changed.
  let avatarsRev = null;
  function noticeAvatars(s) {
    if (s.avatarsRev === undefined || s.avatarsRev === avatarsRev) return;
    const first = avatarsRev === null;
    avatarsRev = s.avatarsRev;
    if (!first) { avatarId = ''; loadAvatar(s.prefs?.avatar ?? 'classic'); }
  }

  /**
   * Load as the page draws it: in steps of LOAD_STEP. The engine moves it every 100 ms tick
   * while busy; each move re-rendered the page and rewrote --amp, which every running
   * animation reads — a style recalculation of the whole creature ten times a second for a
   * difference no one can see. Measured: see docs/RISKS.md #6.
   */
  const LOAD_STEP = 5;
  const loadStep = (load) => Math.round(load / LOAD_STEP) * LOAD_STEP;

  // Depth planes for the gravity layout (layout.js): evaluated on every frame, so a session
  // that has held a new state long enough changes plane even when nothing else moved.
  let planeMap = new Map();
  const planesKey = () => [...planeMap].map(([id, p]) => `${id}${p.plane[0]}`).join(',');
  function updatePlanes(s) {
    const sessions = s.sessions ?? [];
    planeMap = prefs.layout === 'gravity' && sessions.length > 1
      ? planes(sessions.map((x) => ({ id: x.id, state: prefs.paused ? 'IDLE' : x.state, status: x.status, load: x.load ?? 0 })),
               planeMap, Date.now())
      : new Map();
  }

  function render(s) {
    lastFrame = s;
    noticeUpdate(s);
    noticeAvatars(s);
    applyPrefs(s.prefs);
    renderGauge(s.rate_limits?.five_hour ?? null);
    updatePlanes(s);
    const key = JSON.stringify([planesKey(), chatBusy, s.visual, loadStep(s.load), s.state, s.reason, s.tool_calls_per_minute, s.tokens_per_minute, s.context_load, s.sources, s.prefs,
                                (s.sessions ?? []).map((x) => [x.id, x.status, x.state, loadStep(x.load ?? 0), x.reason, x.tool_calls_per_minute, x.context_load,
                                                             (x.agents ?? []).map((a) => [a.id, a.state, a.reason])]), s.focus,
                                s.active_subagents, debug && s.estimated_activity_rate]);
    if (key === last) return;
    last = key;
    // Paused: render as asleep whatever the engine says (it keeps running underneath, so
    // resuming is accurate at once).
    // Its own Claude answering is observable from right here (the run is ours), so it
    // shows as thinking even though that session bypasses the hooks.
    pet.dataset.visual = prefs.paused ? 'IDLE' : chatBusy && s.visual === 'IDLE' ? 'ACTIVE' : s.visual;
    // The why bubble points at one family: if that family is turning, its orbit holds still.
    const why = prefs.paused ? { text: '', family: '' } : whyMessage(s);
    orbitHeld = Boolean(why.text) && ORBIT_PERIOD[planeMap.get(why.family)?.plane] > 0;
    pet.dataset.orbitHold = String(orbitHeld);
    renderCritters(s, prefs.paused ? 'IDLE' : chatBusy && s.visual !== 'HIGH_LOAD' ? 'THINKING' : s.state);
    renderSessions(s.sessions ?? [], s.focus);
    renderWhy(why);
    // "no signal" is a distinct look from "idle": see docs/RISKS.md #5.
    pet.dataset.signal = s.sources.hooks || s.sources.statusline ? 'live' : 'none';

    // Amplitude follows load continuously: changing a custom property inside running
    // keyframes is seamless. Speed does NOT: every change of animation-duration re-maps
    // the current phase and the creature visibly jumps — at one change per 100 ms tick
    // that read as "choppy". So speed moves through three tiers, with hysteresis.
    const t = loadStep(s.load) / 100;
    pet.style.setProperty('--amp', (0.03 + 0.17 * t).toFixed(3));
    const tier = speedTier(s.load);
    if (tier !== currentTier) {
      currentTier = tier;
      pet.style.setProperty('--dur', ['3.2s', '1.4s', '0.7s'][tier]);
    }

    const ctx = s.context_load === null ? '  —' : `${String(s.context_load).padStart(2)}%`;
    hud.textContent =
      `STATE: ${s.state.padEnd(10)} LOAD: ${String(s.load).padStart(3)}\n` +
      `EVENTS/MIN: ${String(s.estimated_activity_rate).padStart(4)}  CTX: ${ctx}\n` +
      `agents ${s.active_subagents}  conf ${s.load_confidence.toFixed(2)}  ` +
      `hooks:${s.sources.hooks ? 'y' : 'n'} net:${s.sources.net ? 'y' : 'n'} sl:${s.sources.statusline ? 'y' : 'n'}\n` +
      (s.sessions ?? []).map((x) => `${x.id} ${x.status}`).join('  ');
  }

  // ---- menu bar (setting `display`) --------------------------------------------------------
  // Rust drives the icon from its own read of the feed (src-tauri/src/tray.rs): hidden, this
  // page is throttled by WebKit and would lag. It only needs to know when a panel opens or
  // closes (the window shows for it) and which language the page resolved.
  function reportPanel(open) {
    if (T) invoke('set_panel_open', { open }).catch((err) => diag(`panel: ${err}`));
  }

  function connect() {
    const es = new EventSource(`${base}/events?token=${encodeURIComponent(token)}`);
    es.onmessage = (e) => { try { render(JSON.parse(e.data)); } catch { /* keep last frame */ } };
    // EventSource reconnects on its own; this only surfaces the gap to the viewer.
    es.onerror = () => { pet.dataset.signal = 'none'; };
  }
  // ---- click-through outside the creature -------------------------------------------------
  // The window is a transparent square; macOS would give it every click inside it, empty
  // corners included. So the page tells the host what is actually drawn — each creature's
  // body as an ellipse, the why bubble, the tray, the open chat panel — and the host
  // (hit.rs) lets clicks fall through everywhere else. Sent only when something moved.
  const HIT_PAD = 6;
  let lastHits = '';
  function visibleRect(el) {
    if (!el) return null;
    const r = el.getBoundingClientRect();
    return r.width >= 1 && r.height >= 1 ? r : null; // display:none anywhere above => 0×0
  }
  function hitShapes() {
    const shapes = [];
    for (const shell of crittersLayer.querySelectorAll('.shell')) {
      const r = visibleRect(shell);
      if (r) shapes.push({ kind: 'ellipse', cx: r.x + r.width / 2, cy: r.y + r.height / 2,
                           rx: r.width / 2 + HIT_PAD, ry: r.height / 2 + HIT_PAD });
    }
    const boxes = [document.getElementById('why'), document.getElementById('tray')];
    if (chatOpen) boxes.push(document.getElementById('bubble'));
    if (!hud.hidden) boxes.push(hud);
    for (const el of boxes) {
      const r = visibleRect(el);
      if (r) shapes.push({ kind: 'rect', x: r.x - HIT_PAD, y: r.y - HIT_PAD,
                           w: r.width + 2 * HIT_PAD, h: r.height + 2 * HIT_PAD });
    }
    return shapes.map((sh) => Object.fromEntries(
      Object.entries(sh).map(([k, v]) => [k, typeof v === 'number' ? Math.round(v) : v])));
  }
  function reportHits() {
    const shapes = hitShapes();
    // Nothing drawn yet (before the first frame): keep the host's default, a fully
    // clickable window, rather than a window that takes no click at all.
    if (shapes.length === 0) return;
    const key = JSON.stringify(shapes);
    if (key === lastHits) return;
    lastHits = key;
    invoke('set_hit_regions', { shapes }).catch((err) => diag(`hit regions: ${err}`));
  }
  // 4 Hz while something can move (a creature animating, the chat open), every 2 s at
  // rest: measuring a still page four times a second cost ~0.4 % CPU for nothing.
  function hitLoop() {
    reportHits();
    setTimeout(hitLoop, animatingNow || chatOpen ? 250 : 2_000);
  }
  if (T) hitLoop();

  // A harness demo draws a frame of its own: no live feed to overwrite it.
  if (!params.get('demo')) connect();
</script>
