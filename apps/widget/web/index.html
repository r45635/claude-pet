<!doctype html>
<meta charset="utf-8" />
<title>claude-pet</title>
<!--
  The creature. One page, two hosts:

    - the Tauri widget (apps/widget/src-tauri), which injects window.__CLAUDE_PET__
      = {url, token} read from ~/.claude-pet/endpoint.json, and renders it transparent;
    - any browser, as a Rust-free harness against a running daemon:

        npm run daemon
        open "apps/widget/web/index.html#token=<token printed by the daemon>&debug"
-->
<style>
  :root {
    --bg: #12141a;
    --ink: #14161c;          /* eyes, mouth */
    --skin-base: #8fb8ff;
    --skin-hot: #ff9f68;
    --skin-bad: #ff6b81;
    /* One colour per kind of activity: the antenna bulb, the accessories, the pastilles. */
    --c-sleep: #3a4152;
    --c-think: #c9a2ff;
    --c-read: #7cc4ff;
    --c-act: #5fd4c4;        /* coding, tools */
    --c-wait: #ffd166;
    --c-done: #8bd17c;
    --c-off: #6b7385;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: #c9d1d9;
               font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  body { display: grid; place-items: center; gap: 14px; grid-auto-flow: row; }
  /* Transparent background in the real widget; the dev page paints one so it is visible. */
  #pet { width: 160px; height: 160px; overflow: visible; }
  .critter { --skin: var(--skin-base); --bulb: var(--c-sleep); }
  .skin { fill: var(--skin); transition: fill .8s ease; }
  .skin-line { stroke: var(--skin); transition: stroke .8s ease; }
  .bulb { fill: var(--bulb); transition: fill .4s ease; }
  .ink { fill: var(--ink); }
  .ink-line { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
  .glint { fill: #fff; }
  .cheek { fill: #ff8fa3; opacity: .5; }

  /* Animation intensity is interpolated from load, never switched in steps:
     --dur and --amp are written by JS from the snapshot. */
  .shaker, .body, .eyes, .arm-wait { transform-box: fill-box; }
  .shaker { transform-origin: 50% 100%; }
  /* The state → animation bindings themselves (breathing, shaking, gestures, step
     bounce) are data in behavior.js, compiled into the "behavior-css" style element
     at startup. Only the keyframes library and the decorative rules live here. */
  .body { transform-origin: 50% 70%; }
  /* --amp follows load (set by JS); --amp-k is an avatar's bounded multiplier on it
     (behavior.js), 1 when absent. */
  @keyframes breathe {
    0%, 100% { transform: scale(1, 1) translateY(0); }
    50%      { transform: scale(calc(1 + var(--amp, .03) * var(--amp-k, 1)), calc(1 - var(--amp, .03) * var(--amp-k, 1) * .6))
                          translateY(calc(var(--amp, .03) * var(--amp-k, 1) * -40px)); }
  }
  @keyframes shake {
    0%, 100% { transform: translate(0, 0) rotate(0); }
    25%      { transform: translate(-2px, 1px) rotate(-2deg); }
    75%      { transform: translate(2px, -1px) rotate(2deg); }
  }
  @keyframes wave { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(10deg); } }
  @keyframes ring { 0%, 100% { opacity: .15; } 50% { opacity: .7; } }

  /* --- one creature, ten looks ------------------------------------------------------
     Every optional part is `.opt` (hidden) and lists the states that show it as
     `on-<STATE>`. The antenna bulb carries the state's colour; the body only changes
     colour when a human should look: storm (orange) and error (red). */
  .opt { display: none; }
  [data-state="IDLE"] .on-IDLE, [data-state="THINKING"] .on-THINKING,
  [data-state="READING"] .on-READING, [data-state="CODING"] .on-CODING,
  [data-state="TOOL_CALL"] .on-TOOL_CALL, [data-state="HIGH_LOAD"] .on-HIGH_LOAD,
  [data-state="WAITING"] .on-WAITING, [data-state="DONE"] .on-DONE,
  [data-state="ERROR"] .on-ERROR { display: inline; }

  /* Fatigue: the session's context window filling up (bands in docs/LOAD_SCORE.md). Marks
     drawn by fatigueMarks() in the script, on every avatar: a sweat drop when overloaded,
     a second one and an unstable glow when exhausted. Never a size change (the creature's
     size must not move by itself), and the glow's flicker is paused with everything else
     at rest. Before the state rules: a storm's or an error's colour still wins. */
  .fat-marks, .fat-halo, .fat-marks .fat-2 { display: none; pointer-events: none; }
  .critter[data-fatigue="overloaded"] > .fat-marks, .critter[data-fatigue="exhausted"] > .fat-marks,
  .critter[data-fatigue="exhausted"] > .fat-marks .fat-2, .critter[data-fatigue="exhausted"] > .fat-halo { display: inline; }
  .critter[data-fatigue="exhausted"] { --skin: #9aa9c4; }
  .fat-drop { fill: #9fd8ff; stroke: rgba(20, 22, 28, .55); stroke-width: 1.5; }
  .fat-halo { fill: none; stroke: #ff9f68; stroke-width: 4; opacity: .3; animation: flicker 2.8s steps(1, end) infinite; }
  @keyframes flicker { 0%, 100% { opacity: .3; } 31% { opacity: .12; } 35% { opacity: .42; } 63% { opacity: .2; } }
  [data-paused="true"] .fat-marks, [data-paused="true"] .fat-halo { display: none !important; }

  .critter[data-state="THINKING"]  { --bulb: var(--c-think); }
  .critter[data-state="READING"]   { --bulb: var(--c-read); }
  .critter[data-state="CODING"]    { --bulb: var(--c-act); }
  .critter[data-state="TOOL_CALL"] { --bulb: var(--c-act); }
  .critter[data-state="HIGH_LOAD"] { --bulb: var(--c-wait); --skin: var(--skin-hot); }
  .critter[data-state="WAITING"]   { --bulb: var(--c-wait); }
  .critter[data-state="DONE"]      { --bulb: var(--c-done); }
  .critter[data-state="ERROR"]     { --bulb: #ffb3bf; --skin: var(--skin-bad); }

  /* Eyes look where the work is: up and aside while thinking, down at the page while
     reading. A tool running keeps them forward. */
  .eyes { transition: transform .5s ease; }
  [data-state="THINKING"] .eyes { transform: translate(3px, -4px); }
  [data-state="READING"] .eyes  { transform: translate(0, 3px); }
  [data-state="CODING"] .eyes   { transform: translate(0, 2px) scale(1, .75); transform-origin: 50% 50%; }

  .thought circle:nth-child(2) { opacity: .75; }
  .thought circle:nth-child(3) { opacity: .5; }
  [data-state="THINKING"] .thought circle { animation: think 1.2s ease-in-out infinite; }
  [data-state="THINKING"] .thought circle:nth-child(2) { animation-delay: .2s; }
  [data-state="THINKING"] .thought circle:nth-child(3) { animation-delay: .4s; }
  @keyframes think { 0%, 100% { opacity: .25; } 40% { opacity: 1; } }

  .arm-wait { transform-origin: 100% 100%; animation: wave 1.6s ease-in-out infinite; }
  .bulb-ring { animation: ring 1.4s ease-in-out infinite; }

  /* The visual tier (storm, distress) drives the shaking — bound in behavior.js.
     Only the creature shakes: the "why" bubble and the pastilles must stay readable. */

  /* Asleep or disconnected = fully still. An always-visible window that animates while
     nothing happens costs ~8% CPU (measured): macOS recomposites the whole transparent
     window every frame. The idle budget is < 1% — see docs/RISKS.md #6. */
  [data-visual="IDLE"] *, [data-signal="none"] * { animation-play-state: paused !important; }

  /* A disconnected creature must not look like a sleeping one: grey, dashed, unplugged. */
  [data-signal="none"] .critter { --skin: #3a4050; --bulb: transparent; }
  [data-signal="none"] .shaker { animation: none; }
  [data-signal="none"] .opt { display: none !important; }
  [data-signal="none"] .on-NOSIGNAL { display: inline !important; }
  [data-signal="none"] .live-only { display: none; }
  [data-signal="none"] .shell { fill: #262a35; stroke: var(--c-off); stroke-width: 2; stroke-dasharray: 6 5; }
  [data-signal="none"] .antenna { stroke: #4a5163; }
  [data-signal="none"] .bulb { stroke: var(--c-off); stroke-width: 2; }
  [data-signal="none"] .eyes { transform: none; }

  /* Image avatars: the .shell is an invisible hit ellipse, and an unplugged creature is its
     IDLE picture, greyed. */
  .critter[data-kind="images"] ellipse.shell,
  [data-signal="none"] .critter[data-kind="images"] ellipse.shell { fill: transparent; stroke: none; }
  [data-signal="none"] .critter[data-kind="images"] image { filter: grayscale(1); opacity: .55; }

  /* The "why" bubble: in a storm or in distress, one short line saying what caused it,
     built from closed values only (snapshot.reason). It sits above the head, in the
     window's margin. */
  #why rect, #why circle { fill: #f4f1ea; }
  #why text { fill: var(--ink); font: 700 11px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  #pet:not([data-why]) #why, #pet[data-why=""] #why { display: none !important; }
  /* A subagent's creature: drawn smaller; its type is in a tooltip. */
  .critter.mini .cheek { display: none; }
  /* Several creatures: the pastilles belong to the single one; the tray stays for the
     usage gauge, in a strip the families leave free (see renderCritters). */
  #pet[data-multi="true"] #dots { display: none; }

  /* A family: the parent in the middle, its subagents wandering around it at random
     (JS picks where; the slot's CSS transition walks them there). Walking = quick little
     steps leaning the way they go; stopped = the gesture of what they do. --k is the
     family's tempo (from its session's load). A family where everyone sleeps is fully
     still: no timer, no animation (the idle CPU budget, docs/RISKS.md #6). */
  .kid-slot { transition-property: transform; transition-timing-function: cubic-bezier(.45, 0, .35, 1); }
  /* The parent's stroll around its anchor (strollFor in the script): a glide, no loop. */
  .wander { transition-property: transform; transition-timing-function: cubic-bezier(.45, 0, .35, 1); }
  /* Enter one-shots and the kid lifecycle animate the critter root, so every critter
     transforms around its feet, not the viewBox origin. */
  .critter { transform-box: fill-box; transform-origin: 50% 100%; }
  /* Same colour as the parent: a dark rim keeps a kid readable when it walks past it. */
  .critter.mini .shell { stroke: rgba(20, 22, 28, .6); stroke-width: 7; paint-order: stroke; }
  @keyframes step-l { 0%, 100% { transform: rotate(-9deg) translateY(0) scale(1.06, .94); }
                      50% { transform: rotate(-9deg) translateY(-22px) scale(.96, 1.05); } }
  @keyframes step-r { 0%, 100% { transform: rotate(9deg) translateY(0) scale(1.06, .94); }
                      50% { transform: rotate(9deg) translateY(-22px) scale(.96, 1.05); } }
  @keyframes nod { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(6deg) translateY(4px); }
                   50% { transform: rotate(-3deg); } 80% { transform: rotate(5deg); } }
  @keyframes tap { 0%, 100% { transform: translateY(0) scale(1.07, .93); } 45% { transform: translateY(-24px) scale(.96, 1.05); } }
  @keyframes hammer { 0%, 100% { transform: rotate(0); } 40% { transform: rotate(-16deg); }
                      55% { transform: rotate(9deg) scale(1.06, .94); } 70% { transform: rotate(0); } }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-30px); } }
  @keyframes cheer { 0%, 100% { transform: translateY(0) scale(1, 1); } 14% { transform: scale(1.18, .82); }
                     40% { transform: translateY(-90px) scale(.9, 1.12); } 58% { transform: translateY(-90px) rotate(360deg); }
                     74% { transform: translateY(0) scale(1.14, .86) rotate(360deg); } 86% { transform: rotate(360deg); } }
  /* Enter one-shots (behavior.js binds them; the .enter class lasts exactly one play):
     a small squash-and-hop for DONE, a recoil for ERROR. Kids appearing and leaving
     grow from / sink into their feet. All transform/opacity only. */
  @keyframes hop { 0%, 100% { transform: translateY(0) scale(1, 1); } 20% { transform: translateY(2px) scale(1.06, .94); }
                   55% { transform: translateY(-14px) scale(.97, 1.04); } 80% { transform: translateY(0) scale(1.03, .97); } }
  @keyframes flinch { 0%, 100% { transform: translate(0, 0) rotate(0); } 25% { transform: translate(-3px, 1px) rotate(-3deg); }
                      60% { transform: translate(2px, 0) rotate(2deg); } }
  @keyframes spawn-in { 0% { transform: scale(.2); opacity: 0; } 70% { transform: scale(1.08); opacity: 1; }
                        100% { transform: scale(1); opacity: 1; } }
  /* perk = attention on WAITING (anticipation squash, then a lift); brace = the squash
     before a storm's shaking; bob and drift-* are the floaty profile's loop and glide
     (bob deepens with load like breathe does). */
  @keyframes perk { 0%, 100% { transform: translateY(0) scale(1, 1); } 25% { transform: translateY(1px) scale(1.04, .96); }
                    60% { transform: translateY(-7px) scale(.98, 1.03) rotate(2deg); } }
  @keyframes brace { 0%, 100% { transform: translateY(0) scale(1, 1); } 40% { transform: translateY(2px) scale(1.08, .9); } }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-1deg); }
                   50% { transform: translateY(calc(var(--amp, .03) * var(--amp-k, 1) * -90px)) rotate(1deg); } }
  @keyframes drift-l { 0%, 100% { transform: rotate(-6deg) translateY(-2px); } 50% { transform: rotate(-7deg) translateY(-8px); } }
  @keyframes drift-r { 0%, 100% { transform: rotate(6deg) translateY(-2px); } 50% { transform: rotate(7deg) translateY(-8px); } }
  @keyframes despawn-out { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(.3); opacity: 0; } }
  /* The parent gliding to its new box when the layout changes (parentSlot in the script). */
  .parent-slot.regrid { animation: regrid .5s cubic-bezier(.45, 0, .35, 1) 1; }
  @keyframes regrid { from { transform: var(--from); } }
  /* Gravity layout: farther planes slightly faded; two parents of the same plane that meet
     bump — one squash each, removed on animationend (seekBump in the script). */
  .family[data-plane="back"] { opacity: .8; transition: opacity .5s ease; }
  .critter.bump { animation: bump .36s ease-out 1; }
  /* The galaxy: the middle and back planes turn slowly around the centre (an .orbit group per
     plane), each family counter-turning around its own centre so its creatures stay upright.
     Paused at rest with everything else, and while the why bubble points at a turning family. */
  .orbit, .family.orbiting { transform-box: view-box; animation-timing-function: linear;
                             animation-iteration-count: infinite; }
  .orbit { animation-name: orbit; }
  .family.orbiting { animation-name: orbit-counter; }
  @keyframes orbit { to { transform: rotate(360deg); } }
  @keyframes orbit-counter { to { transform: rotate(-360deg); } }
  #pet[data-orbit-hold="true"] .orbit, #pet[data-orbit-hold="true"] .family.orbiting { animation-play-state: paused; }
  @keyframes bump { 0%, 100% { transform: scale(1, 1); } 30% { transform: scale(1.14, .84); }
                    65% { transform: scale(.94, 1.07); } }
  .family[data-still="true"] * { animation-play-state: paused !important; }
  #critters .more { fill: #9aa3b5; font: 700 22px -apple-system, BlinkMacSystemFont, sans-serif; }

  /* In the widget the window itself is the frame: no backdrop, no gap, nothing to scroll. */
  html.widget, html.widget body { background: transparent; overflow: hidden; }
  html.widget #pet { width: var(--pet-size, 150px); height: var(--pet-size, 150px); }
  html.widget body { gap: 0; }

  /* Menu preferences. Paused = asleep on purpose: everything still, no pastilles. */
  [data-show-sessions="false"] #dots,
  [data-paused="true"] #sessions, [data-paused="true"] .thought { display: none; }
  [data-paused="true"] * { animation-play-state: paused !important; }

  /* Covers the window so the whole creature is a drag handle (Tauri only reads the
     attribute on the element actually clicked, not on its ancestors). */
  #drag { position: fixed; inset: 0; }

  /* One pastille per live Claude Code session on this machine, in a small tray under
     the feet. The creature shows the busiest session; the pastilles say how many there
     are and what each is doing. */
  #tray { fill: rgba(20, 22, 28, .7); }
  #dots circle { transition: fill .6s ease; }
  #dots .thinking { fill: var(--c-think); animation: pulse .8s ease-in-out infinite; }
  #dots .working { fill: var(--c-act); animation: pulse 1.6s ease-in-out infinite; }
  #dots .waiting { fill: var(--c-wait); }
  #dots .done    { fill: var(--c-done); }
  #dots .idle    { fill: #5a6273; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  /* The session's usage limit, in the same tray: a small bar (how much of the 5-hour
     window is used) and the time left before it resets. */
  #gauge .track { fill: var(--c-sleep); }
  #gauge .fill { fill: var(--c-done); transition: width .6s ease, fill .6s ease; }
  #gauge.warn .fill { fill: var(--c-wait); }
  #gauge.full .fill { fill: var(--skin-bad); }
  #gauge text { fill: #c9cfdb; font: 700 8px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  #pet:not([data-gauge]) #gauge { display: none; }
  /* With several sessions, a ring marks the one the creature is showing. */
  #dots .focus { stroke: #eceff4; stroke-width: 1.5; }

  /* ---- chat panel ----------------------------------------------------------------
     Rust's layout_panel grows the window toward the side with room and keeps the
     creature's square fixed on screen; the page then places square and bubble from the
     returned layout (above/below, right/left). */
  html.chat body { display: block; }
  html.chat #pet { position: fixed; }
  html.chat #drag { inset: auto; }
  #chat[hidden] { display: none; }
  #bubble { position: fixed; left: 10px; right: 10px; display: flex; flex-direction: column;
            background: var(--panel-bg); color: var(--panel-fg); border-radius: 22px;
            border: 1px solid var(--panel-border);
            box-shadow: 0 18px 40px var(--panel-shadow);
            font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  /* The tail: a rotated square on the edge facing the creature, at its centre (--tail-x). */
  #bubble::after { content: ""; position: absolute; left: var(--tail-x, 40px); width: 16px; height: 16px;
                   margin-left: -8px; background: var(--panel-bg-solid); transform: rotate(45deg);
                   border: 1px solid var(--panel-border); }
  .above #bubble::after { bottom: -9px; border-top: 0; border-left: 0; }
  .below #bubble::after { top: -9px; border-bottom: 0; border-right: 0; }
  #bubble header { display: flex; align-items: center; gap: 10px; padding: 10px 8px 6px 16px;
                   font-size: 14px; font-weight: 600; }
  /* The dot mirrors the antenna: lavender while its own Claude is answering. */
  #bubble header::before { content: ""; width: 10px; height: 10px; border-radius: 50%;
                           background: #5a6273; transition: background .3s ease; }
  #bubble.busy header::before { background: var(--c-think); }
  #who { flex: 1; }
  #close { width: 32px; height: 32px; border: 0; background: none; color: var(--panel-muted); font-size: 18px;
           line-height: 1; cursor: pointer; border-radius: 10px; }
  #close:hover { background: var(--panel-hover); color: var(--panel-fg); }
  #messages { flex: 1; overflow-y: auto; padding: 4px 16px 8px; display: flex;
              flex-direction: column; gap: 10px; }
  #messages:empty::before { content: attr(data-empty); color: var(--panel-muted); }
  .you { align-self: flex-end; max-width: 80%; background: var(--skin-base); color: var(--ink);
         padding: 7px 13px; border-radius: 16px 16px 4px 16px; white-space: pre-wrap; }
  .claude { align-self: flex-start; max-width: 100%; overflow-wrap: anywhere; color: var(--panel-fg); }
  .claude.typing { color: var(--panel-muted); }
  .claude pre { background: var(--code-bg); padding: 8px 10px; border-radius: 10px; overflow-x: auto;
                font: 12px/1.4 ui-monospace, Menlo, monospace; margin: 4px 0; }
  .claude code { font: 12.5px ui-monospace, Menlo, monospace; background: var(--code-inline);
                 padding: 2px 6px; border-radius: 6px; }
  #status { min-height: 16px; padding: 0 16px; color: var(--panel-muted); font-size: 12px; }
  #ask { display: flex; align-items: flex-end; gap: 8px; margin: 6px 10px 10px;
         padding: 4px 4px 4px 14px; border-radius: 18px; background: var(--panel-field);
         border: 1px solid var(--panel-border); }
  #ask:focus-within { border-color: rgba(143, 184, 255, .7); }
  #input { flex: 1; resize: none; border: 0; outline: none; background: none; color: var(--panel-fg);
           font: inherit; padding: 7px 0; max-height: 90px; }
  #send { flex: none; width: 34px; height: 34px; border: 0; border-radius: 12px;
          background: var(--skin-base); color: var(--ink); font-size: 16px; font-weight: 700;
          cursor: pointer; }
  #send.stop { background: var(--skin-bad); font-size: 11px; }

  /* ---- settings, inside the bubble (gear in its header) ------------------------------
     The page sends a patch through Rust, the daemon validates it, writes config.json
     and the new values come back on the feed. Size is a display pref; the others are
     engine knobs. */
  #gear { width: 32px; height: 32px; border: 0; border-radius: 10px; background: none;
          color: var(--panel-muted); cursor: pointer; display: grid; place-items: center; }
  #bubble[data-chat="off"] #gear { display: none; }
  #gear:hover, #bubble.settings #gear { background: var(--panel-hover); color: var(--panel-fg); }
  #settings { flex: 1; padding: 2px 16px 12px; display: flex; flex-direction: column; gap: 4px;
              overflow-y: auto; }
  #settings[hidden], #bubble.settings #messages, #bubble.settings #status,
  #bubble.settings #ask { display: none; }
  #settings h3 { margin: 12px 0 2px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
                 color: var(--panel-muted); }
  .setting { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px;
             padding: 6px 0; border-bottom: 1px solid var(--panel-border); }
  .setting label { font-weight: 600; font-size: 13px; }
  .setting output { font-variant-numeric: tabular-nums; color: var(--accent); font-size: 12px; }
  .setting input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 2px 0; }
  .setting input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
  .setting select { font: inherit; font-size: 12px; color: var(--panel-fg); background: var(--panel-field);
                    border: 1px solid var(--panel-border); border-radius: 8px; padding: 3px 6px; max-width: 150px; }
  .setting p { grid-column: 1 / -1; margin: 0; font-size: 11.5px; line-height: 1.35; color: var(--panel-muted); }
  .setting .reset { grid-column: 1 / -1; justify-self: start; border: 0; background: none; padding: 0;
                    color: var(--panel-muted); font: inherit; font-size: 11px; text-decoration: underline; cursor: pointer; }
  .setting .reset:hover { color: var(--panel-fg); }
  .setting input:disabled { opacity: .45; }
  #settings footer { display: flex; align-items: center; gap: 10px; padding-top: 10px; }
  #advanced { border: 1px solid var(--panel-border); background: var(--panel-field); color: var(--panel-fg);
              font: inherit; font-size: 12px; border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  #settings-status { min-height: 16px; font-size: 12px; color: var(--panel-muted); }

  /* Colours of the bubble and the panel: dark by default, light on request or with macOS. */
  :root { --panel-bg: rgba(27, 30, 39, .98); --panel-bg-solid: rgb(27, 30, 39); --panel-fg: #eceff4;
          --panel-muted: #9aa3b5; --panel-border: #323745; --panel-field: #232733;

<script type="module">
  import { buildImageProto, buildSvgProto, scopeCss, keyframeNames, resolveStates, DEFAULT_GEO, DEFAULT_HITBOX } from './avatar.js';
  import { DEFAULT_BEHAVIOR, PROFILES, compileBehavior, mergeBehavior, behaviorFromManifest, enterStates, enterNames } from './behavior.js';
  import { t, fmt, setLocale, currentLocale, translateDom } from './i18n.js';
  import { ORBIT_PERIOD, PLANES, SPACING, bumpCheck, gravityLayout, gridLayout, planes } from './layout.js';
  const pet = document.getElementById('pet');
  const hud = document.getElementById('hud');
  const dotsLayer = document.getElementById('dots');
  const tray = document.getElementById('tray');
  const SVG_NS = 'http://www.w3.org/2000/svg';

  // Pastilles in a tray under the feet, centred, 12 px apart, in first-seen order so a
  // session keeps its place while others come and go.
  function renderSessions(sessions, focus) {
    const shown = sessions.slice(0, 7);
    while (dotsLayer.childElementCount > shown.length) dotsLayer.lastChild.remove();
    while (dotsLayer.childElementCount < shown.length) {
      const dot = document.createElementNS(SVG_NS, 'circle');
      dot.setAttribute('r', '4');
      dot.setAttribute('cy', '154');
      dotsLayer.appendChild(dot);
    }
    traySessions = prefs.showSessions === false || pet.dataset.multi === 'true' ? [] : shown;
    trayFocus = focus;
    layoutTray();
  }
  let traySessions = [];
  let trayFocus = null;

  // Dots, then the gauge, centred together in one tray.
  function layoutTray() {
    const dotsW = traySessions.length * 12;
    const gaugeW = gaugeShown ? 26 + gaugeText.getComputedTextLength() : 0;
    const inner = dotsW + (dotsW && gaugeW ? 4 : 0) + gaugeW;
    const w = inner ? inner + 6 : 0;
    const left = 80 - inner / 2;
    traySessions.forEach((session, i) => {
      const dot = dotsLayer.children[i];
      dot.setAttribute('cx', (left + 6 + i * 12).toFixed(1));
      const focused = traySessions.length > 1 && session.id === trayFocus;
      dot.setAttribute('class', focused ? `${session.status} focus` : session.status);
    });
    const gx = left + dotsW + (dotsW ? 4 : 0);
    gauge.querySelector('.track').setAttribute('x', gx.toFixed(1));
    gauge.querySelector('.fill').setAttribute('x', gx.toFixed(1));
    gaugeText.setAttribute('x', (gx + 26).toFixed(1));
    tray.setAttribute('width', String(w));
    tray.setAttribute('x', String(80 - w / 2));
  }

  // ---- usage limit --------------------------------------------------------------------
  // The current 5-hour window only: a bar for how much is used, the time left before it
  // resets. Account-wide, so the same whichever session the creature shows; hidden when
  // the engine reports it unknown (API key, no sample yet, or just reset).
  const gauge = document.getElementById('gauge');
  const gaugeText = gauge.querySelector('text');
  let gaugeShown = false;
  function untilReset(iso, nowMs) {
    if (!iso) return '';
    return fmt.duration(Math.max(0, Math.round((Date.parse(iso) - nowMs) / 60_000)));
  }
  let gaugeKey = '';
  function renderGauge(win) {
    const left = win ? untilReset(win.resets_at, Date.now()) : '';
    const key = JSON.stringify([win?.used_pct, left, currentLocale()]);
    if (key === gaugeKey) return;
    gaugeKey = key;
    gaugeShown = Boolean(win);
    if (gaugeShown) {
      pet.dataset.gauge = '';
      gauge.querySelector('.fill').setAttribute('width', (22 * win.used_pct / 100).toFixed(1));
      gauge.classList.toggle('warn', win.used_pct >= 70 && win.used_pct < 90);
      gauge.classList.toggle('full', win.used_pct >= 90);
      gaugeText.textContent = left;
      const used = t('gauge.tooltip', { pct: fmt.percent(win.used_pct) });
      gauge.querySelector('title').textContent = win.resets_at
        ? t('gauge.resetsAt', { text: used, time: fmt.time(new Date(win.resets_at)) }) : used;
    } else {
      delete pet.dataset.gauge;
      gaugeText.textContent = '';
    }
    layoutTray();
  }

  // ---- creatures ---------------------------------------------------------------------
  // One creature, as long as there is one session and no subagent: exactly as before.
  // Otherwise one family per session, each in its own square cell: the parent in the
  // middle and its subagents wandering around it at random (see Motion — E · balade).
  // All cells together fit the creature's usual square, never larger.
  const crittersLayer = document.getElementById('critters');
  // The avatar (docs/AVATARS.md): `classic` is the creature drawn in <defs>; another one
  // swaps in its own prototype and geometry (where its feet are, where the why bubble
  // points). Everything else — states, breathing, walking, clicks — works unchanged.
  const classicProto = document.getElementById('critter-proto');
  let proto = classicProto;
  let geo = DEFAULT_GEO;
  const MAX_KIDS = 4;       // beyond, a "+n"
  // A family cell, in the units of the mock-up (a family is wider than tall): parent box
  // and where kids may put their feet. Above parentFeet a kid is behind the parent.
  const CELL = { w: 180, h: 96, parent: { x: 55, y: 6, size: 70 }, kid: 36,
                 area: { x0: 22, x1: 158, y0: 50, y1: 92 }, parentFeet: 72 };
  // Neighbouring cells overlap a little (step < size): a cell's edges are mostly empty, so
  // packing them tighter brings the sessions closer without the families touching. Rows
  // overlap more: a kid is drawn upward from its feet, so the next row's head fits under.
  CELL.step = { x: CELL.w * 0.8, y: 74 };
  // With no subagent anywhere there is no walking area to keep: just the parent, close-packed.
  const COMPACT = { w: 80, h: 76, parent: { x: 5, y: 3, size: 70 }, step: { x: 66, y: 60 } };
  // One session with subagents: the parent keeps most of its size. In a CELL it would drop
  // to 39 % the moment a subagent starts and come back when it ends — on a fresh install
  // that read as the creature switching between small and medium by itself. Kids walk in
  // the band at its feet, in front of it or beside it.
  const SOLO = { w: 160, h: 160, parent: { x: 22, y: 0, size: 116 }, kid: 44,
                 area: { x0: 14, x1: 146, y0: 104, y1: 140 }, parentFeet: 106, step: { x: 160, y: 160 } };
  const WANDERS = new Set(['READING', 'CODING', 'TOOL_CALL', 'THINKING', 'HIGH_LOAD']);
  let crittersKey = '';
  const critterEls = new Map();
  const familyEls = new Map();
  /** Where each family's parent stands, for the why bubble's tail. */
  let familyAnchors = new Map();
  /** Each kid's walk, kept across re-layouts: position in cell units, timer, mode. */
  const walkers = new Map();
  let cells = new Map();     // family id → { x, y, f } (cell origin and scale, viewBox units)

  // Only MAX_KIDS fit: an agent in trouble or waiting on you must never be the one hidden.
  const URGENT = new Set(['ERROR', 'WAITING']);
  const urgentFirst = (agents) => [...agents.filter((a) => URGENT.has(a.state)),
                                   ...agents.filter((a) => !URGENT.has(a.state))];

  function critter(id, mini, title) {
    let el = critterEls.get(id);
    if (!el) {
      el = proto.cloneNode(true);
      el.removeAttribute('id');
      if (mini) {
        el.classList.add('mini');
        const titleEl = document.createElementNS(SVG_NS, 'title');
        titleEl.textContent = title;
        el.prepend(titleEl);
      } else {
        addFatigueMarks(el);
      }
      critterEls.set(id, el);
    }
    return el;
  }

  // ---- fatigue ---------------------------------------------------------------------------
  // A session's creature tires as its context window fills (the status line's %, measured).
  // Unknown stays unknown: no band, no marks — a fresh creature and one we know nothing
  // about must not look alike (docs/LOAD_SCORE.md). Subagents have their own context and
  // no status line: they never tire.
  function fatigueBand(ctx) {
    if (ctx == null || prefs.fatigue === false) return '';
    return ctx >= 88 ? 'exhausted' : ctx >= 70 ? 'overloaded' : ctx >= 40 ? 'energetic' : 'fresh';
  }
  /** The marks, placed from the avatar's hitbox so they sit on any drawing's upper left. */
  function addFatigueMarks(el) {
    const hb = { ...DEFAULT_HITBOX, ...(geo.hitbox ?? {}) };
    const x = hb.cx - hb.rx * 0.86;
    const y = hb.cy - hb.ry * 0.5;
    const drop = (dx, dy, k, cls) => `<path class="fat-drop ${cls}" transform="translate(${(x + dx).toFixed(1)} ${(y + dy).toFixed(1)}) scale(${k})" ` +
      'd="M0 -9 C4 -3 6 0 6 3 A6 6 0 0 1 -6 3 C-6 0 -4 -3 0 -9 Z" />';
    const marks = document.createElementNS(SVG_NS, 'g');
    marks.setAttribute('class', 'fat-marks');
    marks.innerHTML = drop(0, 0, 1, 'fat-1') + drop(-9, 15, 0.7, 'fat-2');
    const halo = document.createElementNS(SVG_NS, 'ellipse');
    halo.setAttribute('class', 'fat-halo');
    for (const [k, v] of Object.entries({ cx: hb.cx, cy: hb.cy, rx: hb.rx + 7, ry: hb.ry + 7 })) halo.setAttribute(k, String(v));
    el.prepend(halo);
    el.append(marks);
  }
  function setFatigue(el, band) {
    if (!el || (el.dataset.fatigue ?? '') === band) return;
    if (band) el.dataset.fatigue = band;
    else delete el.dataset.fatigue;
  }
  function slotted(el, cls) {
    const slot = document.createElementNS(SVG_NS, 'g');
    if (cls) slot.setAttribute('class', cls);
    slot.appendChild(el);
    return slot;
  }
  /**
   * The parent's slot, kept across re-layouts. When its box changes (a subagent arrives,
   * a session opens), it glides there in one short animation from where it was — event-
   * driven, removed on animationend, never while still (a paused glide would freeze the
   * creature at an in-between size).
   */
  const parentSlots = new Map();
  function parentSlot(key, transform) {
    let slot = parentSlots.get(key);
    if (!slot) {
      slot = slotted(critter(key, false), 'parent-slot');
      parentSlots.set(key, slot);
    }
    const before = slot.style.transform || 'none';
    slot.classList.remove('regrid');
    slot.style.transform = transform;
    if (before !== transform && animatingNow && !motionReduced && slot.dataset.placed) {
      slot.style.setProperty('--from', before);
      slot.classList.add('regrid');
    }
    slot.dataset.placed = '1';
    return slot;
  }

  // ---- the walk -------------------------------------------------------------------------
  function kidTransform(cell, w) {
    const { area, kid } = cell.G;
    const t = (w.y - area.y0) / (area.y1 - area.y0);
    const depth = 0.72 + 0.38 * t;               // smaller behind, bigger in front
    const s = cell.f * (kid / 160) * depth;
    // Scale around the feet, where the avatar puts them in its own drawing (80, 146 by default).
    const [fx, fy] = geo.feet;
    return `translate(${(cell.x + w.x * cell.f).toFixed(2)}px, ${(cell.y + w.y * cell.f).toFixed(2)}px) ` +
           `scale(${s.toFixed(4)}) translate(${-fx}px, ${-fy}px)`;
  }
  function familyPace(famId) {
    const load = familyLoads.get(famId) ?? 0;
    return 0.6 + load / 100;                      // 0.6 calm … 1.6 storm
  }
  function stopWalker(w) {
    clearTimeout(w.timer);
    w.timer = 0;
  }
  function schedule(key, ms) {
    const w = walkers.get(key);
    if (!w) return;
    clearTimeout(w.timer);
    w.timer = setTimeout(() => walk(key), ms);
  }
  function walk(key) {
    const w = walkers.get(key);

    const cell = cells.get(w.family);
    if (!cell || !WANDERS.has(w.el.dataset.state) || !animating()) { w.timer = 0; return; }
    const G = cell.G;
    const { x0, x1, y0, y1 } = G.area;
    // Somewhere around the parent, but not standing right in front of its belly.
    const belly = G.parent.x + G.parent.size / 2;
    let nx;
    let ny;
    do {
      nx = x0 + Math.random() * (x1 - x0);
      ny = y0 + Math.random() * (y1 - y0);

    const pace = familyPace(w.family);

    if (layer && w.slot.parentNode !== layer) {

  const familyLoads = new Map();

  // ---- the parent's stroll (setting `wander`) --------------------------------------------------

  // centre of its cell — each target pulled back toward it like a spring, at its session's pace.
  // Never asleep, never while it waits for you (it must stay where you look for it), and it
  // glides home as soon as it stops. Same machinery as the kids' walk: a CSS transition per
  // step and a timer between steps, nothing per frame.

  function driftTo(d, x, y, seconds) {
    d.dx = x;
    d.dy = y;
    d.el.style.transitionDuration = `${seconds.toFixed(2)}s`;
    d.el.style.transform = x || y ? `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px)` : '';
  }

    // Gravity layout: now and then, curiosity — a walk toward a neighbour of the same plane.
    if (prefs.layout === 'gravity' && Math.random() < 0.1 && seekBump(id, d)) return;
    const a = Math.random() * 2 * Math.PI;
    const k = Math.sqrt(Math.random());
    // Mostly sideways, a little up and down: it walks on the floor, it does not fly.
    const tx = d.dx * 0.35 + Math.cos(a) * k * d.r * 0.65;
    const ty = d.dy * 0.35 + Math.sin(a) * k * d.r * 0.25;
    const pace = familyPace(id);
    const seconds = Math.max(0.8, Math.hypot(tx - d.dx, ty - d.dy) / (5 * pace));
    driftTo(d, tx, ty, seconds);
    d.timer = setTimeout(() => stroll(id), seconds * 1000 + (2500 + Math.random() * 3500) / pace);
  }
  // ---- the bump (gravity layout) --------------------------------------------------------------
  // Two parents of the same plane meet: both squash, the walker steps back, the other is nudged.
  // Exceptional by design — gravity keeps same-plane families apart, so it only happens when a
  // stroll heads for a neighbour on purpose, and at most once per family every 20 s.
  // The galaxy's clock: seconds of turning so far. It only advances while things move (the CSS
  // orbits are paused otherwise), so a re-layout restarts each orbit exactly where it stood.
  let orbitMs = 0;

  function orbitAngle(plane) {

  function seekBump(id, d) {
    const me = centres.get(id);

    const now = Date.now();
    const at = (c) => ({ ...c, cx: c.cx + (drifts.get(c.id)?.dx ?? 0), cy: c.cy + (drifts.get(c.id)?.dy ?? 0) });

    driftTo(da, da.dx - ux * r * 0.7, da.dy - uy * r * 0.7, 0.35);
    const db = drifts.get(b);

  /** Wrap a family's parent, and start or stop its stroll for the state it shows. */

      if (multi) {

  }

  // Speed per family, in the same three tiers as the single creature (changing --dur
  // mid-animation makes it jump, so it only moves between tiers, with hysteresis).
  const familyTiers = new Map();
  function familyTier(id, load) {
    let tier = familyTiers.get(id) ?? 0;
    const up = [0, 35, 70];
    while (tier < 2 && load >= up[tier + 1]) tier += 1;
    while (tier > 0 && load < up[tier] - 8) tier -= 1;

  // What the bubble says. Only closed values reach here (a tool class, an API error enum,
  // a load channel, counts): unknown codes get a generic line, never their raw text.
  const TOOLS = new Set(['bash', 'read', 'write', 'edit', 'search', 'fetch', 'task', 'todo', 'notebook', 'mcp']);
  const API_ERRORS = new Set(['rate_limit', 'overloaded', 'server_error']);
  // ctx: the counts the storm line can quote for that creature (unknown → generic words).
  function reasonText(r, ctx) {

    if (r.kind === 'api_error') return t(`why.api.${API_ERRORS.has(r.code) ? r.code : 'other'}`);
    if (r.kind !== 'storm') return '';
    switch (r.driver) {
      case 'tool': return ctx.toolRate > 0 ? t('why.toolRate', { n: ctx.toolRate }) : t('why.lotsOfToolCalls');
      case 'agent': return ctx.agents > 0 ? t('why.subagents', { n: ctx.agents }) : t('why.lotsOfSubagents');
      case 'file': return t('why.lotsOfFiles');

  // One bubble, always full size: in a crowd, the most urgent message, its tail pointing

                                            tokens: s.tokens_per_minute }), family: '' };

    const storm = sessions.find((x) => x.state === 'HIGH_LOAD' && x.reason);

  const whyBubble = document.getElementById('why');

    return measureCtx.measureText(text).width;

  function renderWhy({ text, family }) {
    pet.dataset.why = text;
