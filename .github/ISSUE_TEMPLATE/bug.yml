name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time! The doctor's output usually tells us where the chain breaks.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `~/.claude-pet/app/claude-pet doctor`
      description: From a clone, `npm run doctor`. It contains no personal data, but check before pasting.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: claude-pet version
      placeholder: "claude-pet version → 0.4.0"
  - type: dropdown
    id: client
    attributes:
      label: Where do you run Claude Code?
      options: [Terminal, VS Code extension, Both, Other]
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.1"
