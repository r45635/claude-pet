# Builds the release on a GitHub-hosted Apple Silicon Mac, so users need neither Rust nor
# Node: two archives per version.
#
#   claude-pet-aarch64-apple-darwin.tar.gz   standalone: `claude-pet` (a Node single
#                                            executable) + the widget + the hook scripts
#   claude-pet-widget-<tag>-…tar.gz          the widget alone, which `npm run autostart --
#                                            install` downloads for a clone
#
#   pull request touching the code → tests + build only, kept as workflow artifacts
#   tag v<version>                 → the same, then attached to the GitHub Release
#
# The tag must match package.json, tauri.conf.json and Cargo.toml, because the installer
# looks for the release named after package.json's version: the binary embeds web/, and
# must speak the same protocol as the daemon of the same checkout.
name: release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'apps/widget/**'
      - 'packages/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/release.yml'

# Read-only by default: the build runs third-party code (npm, cargo build scripts, actions)
# and must hold neither a write token nor the signing key. Only `publish` gets them.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15 # arm64
    env:
      TARGET: aarch64-apple-darwin
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Versions agree
        id: version
        run: |
          pkg=$(jq -r .version package.json)
          conf=$(jq -r .version apps/widget/src-tauri/tauri.conf.json)
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' apps/widget/src-tauri/Cargo.toml | head -1)
          [ "$pkg" = "$conf" ] && [ "$pkg" = "$cargo" ] \
            || { echo "::error::package.json $pkg, tauri.conf.json $conf, Cargo.toml $cargo"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
            # v0.2.0, or v0.2.0-rc.1 for a prerelease of the same version — nothing else, so
            # the tag is safe to use as a file name and in shell commands below.
            printf '%s' "$tag" | grep -Eq "^v${pkg//./\\.}(-[0-9A-Za-z.]+)?\$" \
              || { echo "::error::tag $tag does not match version $pkg"; exit 1; }
          else
            tag="v$pkg"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The official build: Homebrew's Node cannot make single executable applications.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'

      - name: Tests
        run: npm ci && npm test

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/widget/src-tauri

      # The npm build of the Tauri CLI is prebuilt: seconds, against minutes for cargo install.
      - name: Build
        working-directory: apps/widget
        run: npx --yes @tauri-apps/cli@2.12.1 build --no-bundle

      - name: Package
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          asset="claude-pet-widget-$TAG-$TARGET.tar.gz"
          bin=apps/widget/src-tauri/target/release/claude-pet-widget
          file "$bin" | grep -q arm64 || { echo "::error::not an arm64 binary"; exit 1; }
          codesign -v "$bin" # the linker's ad-hoc signature, which Apple Silicon requires
          mkdir -p release
          tar -czf "release/$asset" -C "$(dirname "$bin")" claude-pet-widget
          (cd release && shasum -a 256 "$asset" > "$asset.sha256")
          cat release/*.sha256

      - name: Standalone
        run: |
          node scripts/build-standalone.ts --widget apps/widget/src-tauri/target/release/claude-pet-widget
          ./dist/claude-pet/claude-pet version
          mkdir -p release && mv dist/*.tar.gz dist/*.sha256 release/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: claude-pet-${{ steps.version.outputs.tag }}
          path: release/*

  # Tag builds only. Runs no third-party code: it checks out this tag's own signing script,
  # signs what `build` produced and publishes it. The key lives in the `release` environment,
  # which only `v*` tags may deploy to (docs/RISKS.md #12).
  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: claude-pet-${{ needs.build.outputs.tag }}
          path: release

      # The signed manifest names the tag and the file (v0.5.5+ installs check it); the
      # .sha256.sig keeps installs before v0.5.5 working.
      - name: Sign
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          [ -n "$RELEASE_SIGNING_KEY" ] || { echo "::error::RELEASE_SIGNING_KEY secret is missing"; exit 1; }
          node scripts/sign-release.ts --release "$TAG" release/*.tar.gz
          ls -l release

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          prerelease=; case "$TAG" in *-*) prerelease=--prerelease ;; esac
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag $prerelease
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" release/* --clobber
