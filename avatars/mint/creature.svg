<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
<!--
  mint — a recoloured classic with a hat: the commented template for kind "svg" avatars.

  The contract (docs/AVATARS.md):
  - one <g class="critter"> in a 160×160 box, feet at about (80, 146);
  - inside it, <g class="shaker"> (shakes in a storm or an error) > <g class="body"> (breathes),
    and exactly one element with class "shell": the body outline, used for clicks;
  - per-state layers: class="opt on-THINKING" is shown only in THINKING, and so on for
    IDLE, READING, CODING, TOOL_CALL, HIGH_LOAD, WAITING, DONE, ERROR, plus on-NOSIGNAL;
  - shared paint classes from the widget: skin (filled with the skin colour), skin-line (stroked with it),
    ink, ink-line, glint, cheek, bulb. Colours are CSS variables, set in skin.css.
  No script, no event attribute, no external link: the importer strips them.
-->
    <g class="critter" data-state="IDLE">
  <g class="shaker">
  <ellipse cx="80" cy="144" rx="36" ry="5" fill="#000" opacity=".35" />

  <!-- behind the body: arms, storm sparks -->
  <path class="arm-wait opt on-WAITING skin-line" d="M40 94 Q24 80 28 62"
    fill="none" stroke-width="9" stroke-linecap="round" />
  <path class="opt on-TOOL_CALL skin-line" d="M120 92 Q134 82 132 64"
    fill="none" stroke-width="9" stroke-linecap="round" />
  <g class="opt on-HIGH_LOAD" stroke="var(--c-wait)" stroke-width="3" stroke-linecap="round">
<path d="M28 48 l-10 -10" /><path d="M24 76 l-13 0" /><path d="M136 76 l13 0" /><path d="M30 112 l-10 6" />
  </g>

  <!-- antenna: the bulb is the state's colour -->
  <line class="antenna skin-line" x1="80" y1="44" x2="80" y2="27" stroke-width="3" stroke-linecap="round" />
  <circle class="bulb-ring opt on-WAITING" cx="80" cy="22" r="11" fill="none" stroke="var(--c-wait)" stroke-width="2" />
  <circle class="bulb" cx="80" cy="22" r="6" />

  <g class="body">
<ellipse class="skin" cx="62" cy="137" rx="11" ry="6" />
<ellipse class="skin" cx="98" cy="137" rx="11" ry="6" />
<path class="shell skin" d="M80 42 C113 42 126 68 126 96 C126 124 107 138 80 138 C53 138 34 124 34 96 C34 68 47 42 80 42 Z" />
<ellipse class="live-only" cx="80" cy="114" rx="24" ry="15" fill="#fff" opacity=".14" />
<g class="live-only">
  <ellipse class="cheek" cx="54" cy="100" rx="6" ry="3.5" />
  <ellipse class="cheek" cx="106" cy="100" rx="6" ry="3.5" />
</g>

<!-- eyes -->
<g class="eyes opt on-THINKING on-READING on-CODING on-TOOL_CALL on-WAITING on-ERROR">
  <ellipse class="ink" cx="66" cy="88" rx="5.5" ry="7" />
  <ellipse class="ink" cx="94" cy="88" rx="5.5" ry="7" />
  <circle class="glint" cx="68" cy="85" r="1.8" />
  <circle class="glint" cx="96" cy="85" r="1.8" />
</g>
<path class="opt on-CODING ink-line" d="M59 82 h14 M87 82 h14" />
<path class="opt on-ERROR ink-line" d="M57 76 l13 5 M103 76 l-13 5" />
<path class="opt on-IDLE ink-line" d="M59 89 Q66 94 73 89 M87 89 Q94 94 101 89" />
<path class="opt on-DONE ink-line" d="M59 91 Q66 82 73 91 M87 91 Q94 82 101 91" stroke-width="3.5" />
<g class="opt on-HIGH_LOAD">
  <ellipse cx="66" cy="87" rx="8" ry="9" fill="#fff" />
  <ellipse cx="94" cy="87" rx="8" ry="9" fill="#fff" />
  <circle class="ink" cx="66" cy="88" r="3.6" />
  <circle class="ink" cx="94" cy="88" r="3.6" />
</g>
<path class="opt on-NOSIGNAL" d="M60 89 h12 M88 89 h12" stroke="var(--c-off)" stroke-width="3" stroke-linecap="round" />

<!-- mouths -->
<path class="opt on-IDLE ink-line" d="M76 106 Q80 108 84 106" />
<circle class="opt on-THINKING ink" cx="83" cy="106" r="2.6" />
<path class="opt on-READING ink-line" d="M77 104 Q80 106 83 104" />
<g class="opt on-CODING">
  <path class="ink-line" d="M73 105 Q80 109 87 105" />
  <circle cx="85" cy="109" r="2.6" fill="#ff8fa3" />
</g>
<path class="opt on-TOOL_CALL ink" d="M72 103 Q80 112 88 103 Z" />
<path class="opt on-HIGH_LOAD ink-line" d="M69 108 q5.5 -5 11 0 q5.5 5 11 0" />
<ellipse class="opt on-WAITING ink" cx="80" cy="106" rx="3.5" ry="4" />
<path class="opt on-DONE ink" d="M70 102 Q80 115 90 102 Z" />
<path class="opt on-ERROR ink-line" d="M70 111 Q80 102 90 111" />
<path class="opt on-NOSIGNAL" d="M75 106 h10" stroke="var(--c-off)" stroke-width="3" stroke-linecap="round" />

<!-- held: the page being read -->
<g class="opt on-READING">
  <path d="M50 112 L80 118 L110 112 L110 132 L80 138 L50 132 Z" fill="#f4f1ea" />
  <line x1="80" y1="118" x2="80" y2="138" stroke="#c9c3b5" stroke-width="1.5" />
  <path d="M57 120 l16 3 M57 126 l16 3 M87 123 l16 -3 M87 129 l16 -3" stroke="#b3ac9c" stroke-width="1.6" stroke-linecap="round" />
</g>
  </g>

  <!-- floating accessories: what kind of work, at a glance -->
  <g class="opt on-IDLE" fill="var(--c-off)" font-family="ui-monospace, Menlo, monospace" font-weight="700">
<text x="112" y="50" font-size="15">z</text><text x="124" y="36" font-size="11">z</text>
  </g>
  <g class="thought opt on-THINKING" fill="var(--c-think)">
<circle cx="116" cy="50" r="3.5" /><circle cx="128" cy="39" r="4.5" /><circle cx="142" cy="26" r="6" />
  </g>
  <text class="opt on-CODING" x="104" y="48" fill="var(--c-act)" font-family="ui-monospace, Menlo, monospace"
    font-size="18" font-weight="700">&lt;/&gt;</text>
  <g class="opt on-TOOL_CALL" fill="none" stroke-linecap="round">
<g stroke="#d9dee7" stroke-width="5"><path d="M131 60 L142 38" /><path d="M137 30 a7 7 0 1 0 12 4" /></g>
<path d="M148 52 l6 2 M146 60 l6 4" stroke="var(--c-act)" stroke-width="2.5" />
  </g>
  <path class="opt on-HIGH_LOAD" d="M118 52 q7 10 0 15 q-7 -5 0 -15 Z" fill="#9fd8ff" />
  <g class="opt on-WAITING" fill="var(--c-wait)">
<rect x="106" y="20" width="36" height="30" rx="10" />
<path d="M112 48 l-5 10 l13 -8 Z" />
<text x="124" y="42" text-anchor="middle" fill="var(--ink)" font-family="-apple-system, sans-serif"
      font-size="20" font-weight="700">?</text>
  </g>
  <g class="opt on-DONE">
<circle cx="124" cy="42" r="13" fill="var(--c-done)" />
<path d="M118 42 l4 4.5 l8 -9" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<rect x="26" y="40" width="6" height="6" rx="1.5" fill="var(--c-wait)" transform="rotate(20 29 43)" />
<rect x="36" y="22" width="5" height="5" rx="1.5" fill="var(--c-think)" transform="rotate(-15 38 24)" />
<rect x="140" y="70" width="5" height="5" rx="1.5" fill="var(--c-read)" transform="rotate(30 142 72)" />
  </g>
  <g class="opt on-ERROR">
<circle cx="124" cy="42" r="13" fill="var(--ink)" stroke="var(--skin-bad)" stroke-width="3" />
<text x="124" y="49" text-anchor="middle" fill="var(--skin-bad)" font-family="-apple-system, sans-serif"
      font-size="19" font-weight="700">!</text>
  </g>
  <g class="opt on-NOSIGNAL" fill="none" stroke="#8b93a7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
<path d="M114 36 h16 v9 a8 8 0 0 1 -16 0 Z" /><path d="M118 29 v7 M126 29 v7" /><path d="M122 53 v8" />
  </g>

  
  <!-- mint's accessory: a little hat. Drawn inside .shaker so it shakes with the creature. -->
  <g class="hat">
<ellipse cx="80" cy="44" rx="30" ry="6" />
<path d="M62 44 L66 18 Q80 12 94 18 L98 44 Z" />
<rect x="64" y="34" width="32" height="6" class="band" />
  </g>
  </g>
</g>
</svg>
